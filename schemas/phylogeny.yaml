$schema: https://json-schema.org/draft/2020-12/schema
$id: phylogeny

$defs:
  sourceId:
    type: string
    pattern: ^[12][7890]\d\d[a-z]?_[a-z][\w._ -]+$
  authorId:
    type: string
    pattern: ^[\w][\w._ -]*$
  authors:
    type: object
    minProperties: 1
    propertyNames:
      $ref: "#/$defs/authorId"
    additionalProperties:
      $ref: "#/$defs/person"
  sources:
    type: object
    properties:
      publications:
        type: object
        minProperties: 1
        propertyNames:
          pattern: ^[a-z0-9][-a-z0-9]*$
        additionalProperties:
          $ref: "#/$defs/publication"
      articles:
        type: object
        minProperties: 1
        propertyNames:
          $ref: "#/$defs/sourceId"
        additionalProperties:
          $ref: "#/$defs/article"
  taxa:
    type: object
    additionalProperties:
      $ref: "#/$defs/taxon"
  trees:
    type: object
    propertyNames:
      $ref: "#/$defs/sourceId"
    additionalProperties:
      type: object
      properties:
        source:
          $ref: "#/$defs/sourceId"
        taxonomies:
          type: array
          items:
            $ref: "#/$defs/taxonomyTree"
        phylogenies:
          type: array
          items:
            $ref: "#/$defs/phylogeny"
  person:
    type: object
    anyOf:
    - required: [family]
    - required: [given]
    properties:
      family:
        type: string
      given:
        type: string
      suffix:
        type: string
      birth:
        type: integer
        minimum: 1600
        maximum: 2100
      death:
        type: [integer, "null"]
        minimum: 1700
        maximum: 2100
  publication:
    type: object
    required: [name]
    unevaluatedProperties: false
    properties:
      type:
        type: string
        enum:
        - journal
        - book
        default: journal
      name:
        type: string
      publisher:
        type: string
      place:
        type: string
      notes:
        type: string
      editors:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/authorId"
  article:
    type: object
    required: [authors, pubDate]
    oneOf:
    - required: [journal, title]
    - required: [book]
    - required: [reading, title]
    unevaluatedProperties: false
    properties:
      seen:
        type: boolean
        default: true
      complete:
        type: object
        properties:
          named:
            type: [boolean, "null"]
            default: false
          open:
            type: [boolean, "null"]
            default: false
          history:
            type: [boolean, "null"]
            default: false
          specimens:
            type: object
            properties:
              basic:
                type: [boolean, "null"]
                default: false
              all:
                type: [boolean, "null"]
                default: false
          notes:
            type: string
      journal:
        type: string
      book:
        type: string
      reading:
        type: string
      volume:
        type: [integer, string]
        minimum: 1
      number:
        type: [integer, string]
        minimum: 1
      articleNumber:
        type: [integer, string]
        minimum: 1
      chapter:
        type: [integer, string]
      pages:
        $comment: Page numbers alternate start and end of ranges.
        type: array
        items:
          type: [integer, string]
        minItems: 2
      plates:
        $comment: Plate numbers alternate start and end of ranges.
        type: array
        items:
          type: [integer, string]
        minItems: 2
      title:
        type: string
      translations:
        additionalProperties:
          type: string
      authors:
        type: array
        minItems: 1
        items:
          type: string
      editors:
        type: array
        minItems: 1
        items:
          type: string
      pubDate:
        $ref: "#/$defs/modularDate"
        unevaluatedProperties: false
      processDates:
        type: object
        additionalProperties: false
        properties:
          submitted:
            $ref: "#/$defs/simpleDate"
          received:
            $ref: "#/$defs/simpleDate"
          revised:
            $ref: "#/$defs/simpleDate"
          accepted:
            $ref: "#/$defs/simpleDate"
          transmitted:
            $ref: "#/$defs/simpleDate"
          online:
            $ref: "#/$defs/simpleDate"
          published:
            $ref: "#/$defs/simpleDate"
          issued:
            $ref: "#/$defs/simpleDate"
          conferenceStart:
            $ref: "#/$defs/simpleDate"
          conferenceEnd:
            $ref: "#/$defs/simpleDate"
          unknown:
            $ref: "#/$defs/simpleDate"
      translationOf:
        type: string
      identifiers:
        type: object
        additionalProperties: false
        properties:
          url:
            type: string
            format: iri
          doi:
            type: string
          jstor:
            type: integer
            minimum: 1
      quotes:
        type: array
        items:
          type: string
      notes:
        type: string
  authority:
    type: object
    required:
    - source
    unevaluatedProperties: false
    properties:
      source:
        type: string
      in:
        $ref: "#/$defs/authority"
      ex:
        $ref: "#/$defs/authority"
      pages:
        type: array
        items:
          type: [number, string]
      plates:
        type: array
        items:
          type: [number, string]
      notes:
        type: string
  taxonBasic:
    type: object
    if:
      oneOf:
      - required: [auth]
      - required: [authority]
    then:
      required: [name]
    else:
      oneOf:
      - required: [altRankOf, rank]
      - required: [altSpellingOf, name]
    properties:
      name:
        type: [string, "null"]
        pattern: ^[A-Za-z][a-zæ-]*$
      rank:
        type: string
        enum:
        - Domain
        - Kingdom
        - Subkingdom
        - Superphylum
        - Phylum
        - Subphylum
        - Infraphylum
        - Superclass
        - Class
        - Subclass
        - Infraclass
        - Superorder
        - Order
        - Suborder
        - Superfamily
        - Family
        - Subfamily
        - genus
        - subgenus
        - species
        - subspecies
        - variety
        - Branch
        - Grade
        - Clade
        - Plesion
        - Scion
        - Unranked
      authority:
        $ref: "#/$defs/authority"
      auth:
        type: array
        items:
          type: string
      year:
        type: integer
        minimum: 1700
        maximum: 2030 # Fragile!  But helpful for now.  Apologies to the future.
      bracket:
        ### TODO: Replace this property name
        type: string
      status:
        type: string
      originalParent:
        type: string
      modifier:
        type: string
      in:
        type: array
        items:
          type: string
      altRankOf:
        type: string
      altSpellingOf:
        type: string
      needsQualification:
        type: boolean
        default: false
      notes:
        type: string
  taxon:
    $ref: "#/$defs/taxonBasic"
    unevaluatedProperties: false
    # These extra properties might not be extra now.
    properties:
      homonym:
        type: boolean
        default: false
      synonym:
        type: string
      reason:
        type: string
  tree:
    $id: tree
    $dynamicAnchor: tree
    type: object
    properties:
      taxon:
        type: string
      type:
        type: boolean
        default: false
      new:
        type: boolean
        default: false
      pages:
        type: array
        items:
          type: [number, string]
      plates:
        type: array
        items:
          type: [number, string]
      children:
        type: array
        items:
          $dynamicRef: tree
      notes:
        type: string
  taxonomyTree:
    $id: taxonomyTree
    $dynamicAnchor: tree
    $ref: tree
    properties:
      # TODO: Something is off here, dup field?
      modifier:
        type: string
      quoted:
        type: boolean
        default: false
      stem:
        type: boolean
        default: false
      specimens:
        $ref: "phylogeny#/$defs/specimen"
      diagnosis:
        type: [string, "null"]
      emended:
        type: [boolean,"null"]
        default: null
      parents:
        type: array
        items:
          $ref: taxonomyTree
      synonyms:
        type: array
        items:
          $ref: taxonomyTree
      non:
        type: array
        items:
          $ref: taxonomyTree
      moved:
        $ref: taxonomyTree
      corrected:
        $ref: taxonomyTree
      or:
        type: array
        items:
          $ref: taxonomyTree
      affTaxon:
        type: string
      cfTaxon:
        type: string
      openTaxon:
        type: string
      altPlacements:
        type: array
        items:
          $ref: taxonomyTree
      auth:
        $comment: overrides taxon field
        type: array
        minItems: 1
        items:
          type: string
      year:
        $comment: overrides taxon field
        type: integer
        minimum: 1700
        maximum: 2030 # Fragile!  But helpful for now.  Apologies to the future.
      authority:
        $ref: "phylogeny#/$defs/authority"
    unevaluatedProperties: false
  phylogeny:
    type: object
    required: [tree]
    additionalProperties: false
    properties:
      treeType:
        type: string  # Enum?  Meh.
      tree:
        $ref: phylogenyTree
  phylogenyTree:
    $id: phylogenyTree
    $dynamicAnchor: tree
    $ref: tree
    properties:
      outgroup:
        type: boolean
        default: false
      data:
        type: object
        additionalProperties:
          type: number
      categories:
        type: array
        items:
          type: string
    unevaluatedProperties: false
  specimen:
    type: object
    properties:
      holotype:
        type: string
      allotype:
        type: string
      lectotype:
        type: string
      neotype:
        type: string
    additionalProperties:
      type: array
      items:
        type: string
    propertyNames:
      enum:
      - hypotypes
      - kleptotypes
      - paralectotypes
      - paratypes
      - plesiotypes
      - syntypes
      - topotypes
      - additional
      - unknown
  simpleDate:
    type: string
    pattern: ^[12][7890]\d\d-[01]\d-[0123]\d$
  modularDate:
    type: object
    required: [year]
    properties:
      year:
        type: integer
        minimum: 1700 # Linnaeus was born in 1707
        maximum: 2030
      month:
        type: integer
        minimum: 1
        maximum: 12
      day:
        type: integer
        minimum: 1
    if:
      required: [day]
    then:
      required: [month]
      oneOf:
      - properties:
          month:
            const: 2
          day:
            maximum: 28
      - properties:
          month:
            anyOf:
            - const: 4
            - const: 6
            - const: 9
            - const: 11
          day:
            maximum: 30
      - properties:
          month:
            anyOf:
            - const: 1
            - const: 3
            - const: 5
            - const: 7
            - const: 8
            - const: 10
            - const: 12
          day:
            maximum: 31
