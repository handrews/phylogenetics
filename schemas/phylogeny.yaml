$schema: https://json-schema.org/draft/2020-12/schema
$id: phylogeny

$defs:
  sourceId:
    type: string
    pattern: ^([12][7890]\d\d[a-z]?|inprep)_[a-z][\w._ -]+$
  authorId:
    type: string
    pattern: ^[\w][\w._ -]*$
  authors:
    type: object
    minProperties: 1
    propertyNames:
      $ref: "#/$defs/authorId"
    additionalProperties:
      $ref: "#/$defs/person"
  publications:
    type: object
    minProperties: 1
    propertyNames:
      pattern: ^[a-z0-9][-a-z0-9]*$
    additionalProperties:
      $ref: "#/$defs/publication"
  sources:
    type: object
    minProperties: 1
    propertyNames:
      $ref: "#/$defs/sourceId"
    additionalProperties:
      $ref: "#/$defs/article"
  taxa:
    type: object
    additionalProperties:
      $ref: "#/$defs/taxon"
  trees:
    type: object
    propertyNames:
      $ref: "#/$defs/sourceId"
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        source:
          $ref: "#/$defs/sourceId"
        taxonomies:
          type: array
          items:
            $ref: "#/$defs/tree"
        phylogenies:
          type: array
          items:
            $ref: "#/$defs/phylogeny"
        assumptions:
          type: array
          items:
            $ref: "#/$defs/tree"
        notes:
          type: string
  person:
    type: object
    anyOf:
    - required: [family]
    - required: [given]
    properties:
      family:
        type: string
      given:
        type: string
      suffix:
        type: string
      birth:
        type: integer
        minimum: 1600
        maximum: 2100
      death:
        type: [integer, "null"]
        minimum: 1700
        maximum: 2100
  publication:
    type: object
    required: [name]
    unevaluatedProperties: false
    properties:
      type:
        type: string
        enum:
        - journal
        - book
        default: journal
      name:
        type: string
      publisher:
        type: string
      place:
        type: string
      notes:
        type: string
      editors:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/authorId"
  article:
    type: object
    required: [authors]
    oneOf:
    - required: [journal, title, pubDate]
    - required: [book, pubDate]
    - required: [reading, title, pubDate]
    - required: [inPrep]  # Allow for a never-published untitled source
    unevaluatedProperties: false
    properties:
      seen:
        type: boolean
        default: true
      inPrep:
        description: |
          Indicates that the authority is an unpublished "in-preparation"
          paper; any names are nomen nudum unless/until publication.
        type: boolean
        default: false
      complete:
        type: object
        properties:
          named:
            type: [boolean, "null"]
            default: false
          open:
            type: [boolean, "null"]
            default: false
          history:
            type: [boolean, "null"]
            default: false
          specimens:
            type: object
            properties:
              basic:
                type: [boolean, "null"]
                default: false
              all:
                type: [boolean, "null"]
                default: false
          notes:
            type: string
      journal:
        type: string
      book:
        type: string
      reading:
        type: string
      series:
        type: [integer, string]
        $comment: Intended for journals that reset volume numbering.
      volume:
        type: [integer, string]
        minimum: 1
      number:
        type: [integer, string]
        minimum: 1
      articleNumber:
        type: [integer, string]
        minimum: 1
      chapter:
        type: [integer, string]
      pages:
        $comment: Page numbers alternate start and end of ranges.
        type: array
        items:
          type: [integer, string]
        minItems: 2
      plates:
        $comment: Plate numbers alternate start and end of ranges.
        type: array
        items:
          type: [integer, string]
      title:
        type: string
      translations:
        additionalProperties:
          type: string
      authors:
        type: array
        minItems: 1
        items:
          type: string
      editors:
        type: array
        minItems: 1
        items:
          type: string
      pubDate:
        $ref: "#/$defs/modularDate"
        unevaluatedProperties: false
      processDates:
        type: object
        additionalProperties: false
        properties:
          submitted:
            $ref: "#/$defs/simpleDate"
          received:
            $ref: "#/$defs/simpleDate"
          revised:
            $ref: "#/$defs/simpleDate"
          accepted:
            $ref: "#/$defs/simpleDate"
          transmitted:
            $ref: "#/$defs/simpleDate"
          online:
            $ref: "#/$defs/simpleDate"
          published:
            $ref: "#/$defs/simpleDate"
          printed:
            $ref: "#/$defs/simpleDate"
          issued:
            $ref: "#/$defs/simpleDate"
          read:
            $ref: "#/$defs/simpleDate"
          conferenceStart:
            $ref: "#/$defs/simpleDate"
          conferenceEnd:
            $ref: "#/$defs/simpleDate"
          unknown:
            $ref: "#/$defs/simpleDate"
      translationOf:
        type: string
      identifiers:
        type: object
        additionalProperties: false
        properties:
          url:
            type: string
            format: iri
          doi:
            type: string
          jstor:
            type: integer
            minimum: 1
      quotes:
        type: array
        items:
          type: string
      notes:
        type: string
  authority:
    type: object
    oneOf:
    - required:
      - source
    - required:
      - in
    unevaluatedProperties: false
    properties:
      source:
        type: string
      authors:
        type: array
        items:
          type: string
      in:
        $ref: "#/$defs/sourceId"
      ex:
        $ref: "#/$defs/authority"
      page:
        type: [number, string]
      pages:
        type: array
        items:
          type: [number, string]
      plates:
        type: array
        items:
          type: [number, string]
      figures:
        type: array
        items:
          $ref: "#/$defs/figure"
      notes:
        type: string
  rank:
    type: string
    enum:
    - Domain
    - Kingdom
    - Subkingdom
    - Superphylum
    - Phylum
    - Subphylum
    - Infraphylum
    - Superclass
    - Class
    - Subclass
    - Infraclass
    - Parvclass
    - Superorder
    - Order
    - Suborder
    - Superfamily
    - Family
    - Subfamily
    - genus
    - subgenus
    - species
    - subspecies
    - variety
    - Division
    - section
    - Branch
    - Group
    - Grade
    - Clade
    - Plesion
    - Scion
    - Unranked
  taxon:
    type: object
    if:
      oneOf:
      - required: [auth]
      - required: [authority]
    then:
      required: [name]
    else:
      oneOf:
      - required: [altRankOf, rank]
      - required: [altSpellingOf, name]
      - required: [vulgarSpellingOf, name]
    unevaluatedProperties: false
    properties:
      name:
        type: [string, "null"]
        pattern: ^[\w][\w._ -]*$
      identifier:
        description: |
          The phrase given in place of a name for taxa in open nomenclature
      rank:
        $ref: "#/$defs/rank"
      authority:
        $ref: "#/$defs/authority"
      auth:
        type: array
        items:
          type: string
      year:
        $ref: "#/$defs/publicationYear"
      bracket:
        ### TODO: Replace this property name
        type: string
      status:
        type: string
      originalParent:
        type: string
      modifier:
        type: string
      in:
        type: array
        items:
          type: string
      altRankOf:
        type: string
      altSpellingOf:
        type: string
      vulgarSpellingOf:
        type: string
      lang:
        type: string
        minLength: 2
        maxLength: 2
      needsQualification:
        type: boolean
        default: false
      holotype:
        type: object
        additionalProperties:
          type: array
          items:
            type: [array, string, integer]
            items:
              type: [string, integer]
      homonym:
        type: boolean
        default: false
      synonym:
        type: string
      reason:
        type: string
      notes:
        type: string
  tree:
    $id: tree
    type: object
    properties:
      mergeInto:
        type: array
        minItems: 2
        maxItems: 2
        prefixItems:
        - $ref: "phylogeny#/$defs/sourceId"
        - type: integer
          minimum: 0
      taxon:
        type: string
      type:
        type: boolean
        default: false
      new:
        type: boolean
        default: false
      pars:
        type: boolean
        default: false
      provisional:
        $comment: The assignment to parent taxon is provisional
        type: boolean
        default: false
      questionable:
        $comment: The current taxon is questionable
        type: boolean
        default: false
      tentative:
        $comment: For synonyms / non
        type: boolean
        default: true
      plates:
        type: array
        items:
          type: [number, string]
      children:
        type: array
        items:
          $ref: tree
      bracket:
        type: string
      matrix:
        type: array
        items:
          type: [number, string]
      bootstrap:
        type: integer
      modifier:
        type: string
      occurrences:
        type: array
        items:
          $ref: "phylogeny#/$defs/occurrence"
      source:
        type: string
      citation:
        type: object
        required: [source]
        properties:
          authors:
            type: array
            items:
              type: string
          source:
            type: string
          year:
            type: number
          disambiguator:
            type: string
          content:
            type: [number, string]
          pages:
            type: array
            items:
              type: [integer, string]
          plates:
            type: array
            items:
              type: [integer, string]
          figures:
            $ref: "phylogeny#/$defs/multiRanges"
        additionalProperties: false
      notes:
        type: string
      # TODO: Something is off here, dup field?
      quoted:
        type: boolean
        default: false
      stem:
        type: boolean
        default: false
      page:
        type: [integer, string]
      pages:
        $ref: "phylogeny#/$defs/multiRanges"
      figures:
        type: array
        items:
          $ref: "phylogeny#/$defs/figure"
      specimens:
        $ref: "phylogeny#/$defs/specimens"
      diagnosis:
        type: [string, "null"]
      emended:
        type: [boolean,"null"]
        default: null
      parents:
        type: array
        items:
          $ref: tree
      synonyms:
        type: array
        items:
          $ref: tree
      removed:
        type: array
        items:
          $ref: tree
      non:
        type: array
        items:
          $ref: tree
      moved:
        $ref: tree
      corrected:
        $ref: tree
      or:
        type: array
        items:
          $ref: tree
      affTaxon:
        type: string
      cfTaxon:
        type: string
      openTaxon:
        type: string
      altPlacements:
        type: array
        items:
          $ref: tree
      rank:
        $ref: "phylogeny#/$defs/rank"
      auth:
        $comment: overrides taxon field
        type: array
        minItems: 1
        items:
          type: string
      in:
        $comment: overrides taxon field
        type: array
        minItems: 1
        items:
          type: string
      year:
        $comment: overrides taxon field
        $ref: "phylogeny#/$defs/publicationYear"
      authority:
        $ref: "phylogeny#/$defs/authority"
      outgroup:
        type: boolean
        default: false
      data:
        type: object
        additionalProperties:
          type: number
      categories:
        type: array
        items:
          type: string
    unevaluatedProperties: false
  phylogeny:
    type: object
    required: [tree, treeType]
    additionalProperties: false
    properties:
      treeType:
        type: string
        enum:
        - taxonomy
        - cladogram
        - diagram
        - other
      tree:
        $ref: tree
      notes:
        type: string
      methodology:
        type: string
      characteristics:
        type: array
        items:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: [number, string]
  multiRanges:
    type: array
    items:
      type: [integer, string, array]
      minItems: 2
      maxItems: 2
      items:
        type: [integer, string]
  figure:
    type: object
    properties:
      source:
        $ref: "#/$defs/sourceId"
      plate:
        type: [integer, string]
      page:
        type: [integer, string]
      figure:
        type: [integer, string]
      textFigure:
        type: [integer, string]
      figures:
        $ref: "#/$defs/multiRanges"
      textFigures:
        $ref: "#/$defs/multiRanges"
      location:
        type: [integer, string]
      collectedFrom:
        type: string
      uncertain:
        description: |
          If true, the assignment of the specimen to the given taxon
          is uncertain, but no other identifiable taxon (such as a cf. taxon)
          was defined.
        type: boolean
        default: false
      notes:
        type: string
  basicOccurrence:
    type: object
    properties:
      eon:
        $ref: "#/$defs/eon"
      era:
        $ref: "#/$defs/era"
      period:
        $ref: "#/$defs/period"
      series:
        $ref: "#/$defs/series"
      seriesBoundary:
        $ref: "#/$defs/seriesRange"
      seriesRange:
        $ref: "#/$defs/seriesRange"
      stage:
        $ref: "#/$defs/stage"
      stageBoundary:
        $ref: "#/$defs/stageRange"
      stageRange:
        $ref: "#/$defs/stageRange"
      stageModifier:
        $ref: "#/$defs/stageModifier"
      superunit:
        type: string
      unit:
        type: [string, array]
        items:
          type: string
      subunit:
        type: string
      section:
        type: string
      biota:
        type: string
      biozone:
        type: string
      biozones:
        type: array
        items:
          type: string
        minItems: 2
      biozoneRange:
        type: array
        items:
          type: string
        minItems: 2
        maxItems: 2
      fauna:
        type: array
        items:
          type: string
      paleocontinent:
        type: string
      location:
        type: array
        items:
          type: string
      sources:
        type: array
        items:
          $ref: "#/$defs/sourceId"
      notes:
        type: string
      specimens:
        type: object
        additionalProperties:
          type: object
          items:
            type: [string, integer, array]
            items:
              type: [string, integer]
      possibleSpecimens:
        type: object
        additionalProperties:
          type: object
          items:
            type: [string, array]
            items:
              type: string
  occurrence:
    $ref: "#/$defs/basicOccurrence"
    properties:
      tentative:
        type: boolean
        default: false
      localPeriod:
        type: string
      localSeries:
        $ref: "#/$defs/localSeries"
      localSeriesBoundary:
        $ref: "#/$defs/localSeriesRange"
      localSeriesRange:
        $ref: "#/$defs/localSeriesRange"
      localStage:
        $ref: "#/$defs/localStage"
      localStageBoundary:
        $ref: "#/$defs/localStageRange"
      localStageRange:
        $ref: "#/$defs/localStageRange"
      localStageModifier:
        $ref: "#/$defs/stageModifier"
      inferred:
        $ref: "#/$defs/basicOccurrence"
        unevaluatedProperties: false
    unevaluatedProperties: false
  eon:
    type: string
    enum:
    - Hadean
    - Archean
    - Proterozoic
    - Phanerozoic
  era:
    type: string
    enum:
    - Eoarchean
    - Paleoarchean
    - Mesoarchean
    - Neoarchean
    - Paleoproterozoic
    - Mesoproterozoic
    - Neoproterozoic
    - Paleozoic
    - Mesozoic
    - Cenozoic
  period:
    type: string
    enum:
    - Siderian
    - Rhyacian
    - Orosirian
    - Statherian
    - Calymmian
    - Ectasian
    - Stenian
    - Tonian
    - Cryogenian
    - Ediacaran
    - Cambrian
    - Ordovician
    - Silurian
    - Devonian
    - Carboniferous
    - Permian
    - Triassic
    - Jurassic
    - Cretaceous
    - Paleogene
    - Neogene
    - Quaternary
  localSeries:
    type: string
  localSeriesRange:
    type: array
    items:
      $ref: "#/$defs/localSeries"
    minItems: 2
    maxItems: 2
  seriesRange:
    type: array
    items:
      $ref: "#/$defs/series"
    minItems: 2
    maxItems: 2
  series:
    type: string
    enum:
    - Terrenuevian
    - Cambrian Series 2
    - Miaolingian
    - Furongian
    - Lower Ordovician
    - Middle Ordovician
    - Upper Ordovician
    - Llandovery
    - Wenlock
    - Ludlow
    - Přídolí
    - Lower Devonian
    - Middle Devonian
    - Upper Devonian
    - Lower Mississippian
    - Middle Mississippian
    - Upper Mississippian
    - Lower Pennsylvanian
    - Middle Pennsylvanian
    - Upper Pennsylvanian
    - Cisuralian
    - Guadalupian
    - Lopingian
    - Lower Triassic
    - Middle Triassic
    - Upper Triassic
    - Lower Jurassic
    - Middle Jurassic
    - Upper Jurassic
    - Lower Cretaceous
    - Upper Cretaceous
    - Paleocene
    - Eocene
    - Oligocene
    - Miocene
    - Pliocene
    - Pleistocene
    - Holocene
  localStage:
    type: string
  localStageRange:
    type: array
    items:
      $ref: "#/$defs/localStage"
    minItems: 2
    maxItems: 2
  stageRange:
    type: array
    items:
      $ref: "#/$defs/stage"
    minItems: 2
    maxItems: 2
  stageModifier:
    type: string
    enum: [lower, middle, upper]
  stage:
    type: string
    enum:
    - Fortunian
    - Cambrian Stage 2
    - Cambrian Stage 3
    - Cambrian Stage 4
    - Wuliuan
    - Drumian
    - Guzhangian
    - Paibian
    - Jiangshanian
    - Cambrian Stage 10
    - Tremadocian
    - Floian
    - Dapingian
    - Darriwilian
    - Sandbian
    - Katian
    - Hirnantian
    - Rhuddanian
    - Aeronian
    - Telychian
    - Sheinwoodian
    - Homerian
    - Gorstian
    - Ludfordian
    - Lochkovian
    - Pragian
    - Emsian
    - Eifelian
    - Givetian
    - Frasnian
    - Famennian
    - Touraisian
    - Viséan
    - Serpukhovian
    - Baskirian
    - Moscovian
    - Kasimovian
    - Gzhelian
    - Asselian
    - Sakmarian
    - Artinskian
    - Kungurian
    - Roadian
    - Wordian
    - Capitanian
    - Wuchiapingian
    - Changhsingian
    - Induan
    - Olenekian
    - Anisian
    - Ladinian
    - Carnian
    - Norian
    - Rhaetian
    - Hettangian
    - Sinemurian
    - Toarcian
    - Aalenian
    - Bajocian
    - Bathonian
    - Callovian
    - Oxfordian
    - Kimmeridgian
    - Tithonian
    - Berriasian
    - Valanginian
    - Hauterivian
    - Barremian
    - Aptian
    - Albian
    - Cenomanian
    - Turonian
    - Coniacian
    - Santonian
    - Campanian
    - Maastrichtian
    - Danian
    - Selanian
    - Thanetian
    - Ypresian
    - Lutetian
    - Bartonian
    - Priabonian
    - Rupelian
    - Chattian
    - Aquitanian
    - Burdigalian
    - Langhian
    - Serravallian
    - Tortonian
    - Messinian
    - Zanclean
    - Piacenzian
    - Gelasian
    - Calabrian
    - Chibanian
    - Upper Pleistocene # Tarantian
    - Greenlandian
    - Northgrippian
    - Meghalayan
  specimen:
    oneOf:
    - type: string
    - type: object
      properties:
        repository:
          type: string
        id:
          type: [integer, string]
        figures:
          type: array
          items:
            $ref: "#/$defs/figure"
  specimens:
    type: object
    properties:
      repository:
        type: string
      holotype:
        $ref: "#/$defs/specimen"
      allotype:
        $ref: "#/$defs/specimen"
      lectotype:
        $ref: "#/$defs/specimen"
      neotype:
        $ref: "#/$defs/specimen"
      syntype:
        $ref: "#/$defs/specimen"
    additionalProperties:
      type: array
      items:
        type: [string, array]
        items:
          $ref: "#/$defs/specimen"
    propertyNames:
      enum:
      - holotype
      - allotype
      - lectotype
      - neotype
      - syntype
      - hypotypes
      - kleptotypes
      - paralectotypes
      - paratypes
      - plesiotypes
      - syntypes
      - topotypes
      - additional
      - unknowntypes
  publicationYear:
    $comment: Linnaeus was born in 1707.  The upper bound is fragile but
      helpful for now; apologies to the future.
    type: integer
    minimum: 1700
    maximum: 2030
  simpleDate:
    type: string
    pattern: ^[12][7890]\d\d-[01]\d-[0123]\d$
  modularDate:
    type: object
    required: [year]
    properties:
      year:
        $ref: "#/$defs/publicationYear"
      month:
        type: integer
        minimum: 1
        maximum: 12
      months:
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 12
      day:
        type: integer
        minimum: 1
        maximum: 31
      season:
        type: string
        enum: [spring, summer, fall, autumn, winter]
    if:
      required: [day]
    then:
      required: [month]
      oneOf:
      - properties:
          month:
            const: 2
          day:
            maximum: 28
      - properties:
          month:
            anyOf:
            - const: 4
            - const: 6
            - const: 9
            - const: 11
          day:
            maximum: 30
      - properties:
          month:
            anyOf:
            - const: 1
            - const: 3
            - const: 5
            - const: 7
            - const: 8
            - const: 10
            - const: 12
          day:
            maximum: 31
