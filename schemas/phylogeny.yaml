  specimen:
    oneOf:
    - type: string
    - type: object
      properties:
        repository:
          type: string
        id:
          $ref: "#/$defs/citationNumber"
        illustrations:
          type: array
          items:
            $ref: "#/$defs/illustration"
  specimens:
    type: object
    properties:
      repository:
        type: string
      holotype:
        $ref: "#/$defs/specimen"
      allotype:
        $ref: "#/$defs/specimen"
      lectotype:
        $ref: "#/$defs/specimen"
      neotype:
        $ref: "#/$defs/specimen"
      syntype:
        $ref: "#/$defs/specimen"
    additionalProperties:
      type: array
      items:
        type: [string, array]
        items:
          $ref: "#/$defs/specimen"
    propertyNames:
      enum:
      - holotype
      - allotype
      - lectotype
      - neotype
      - syntype
      - hypotypes
      - kleptotypes
      - paralectotypes
      - paratypes
      - plesiotypes
      - syntypes
      - topotypes
      - additional
      - unknowntypes
  publicationYear:
    $comment: Linnaeus was born in 1707.  The upper bound is fragile but
      helpful for now; apologies to the future.
    type: integer
    minimum: 1700
    maximum: 2030
  simpleDate:
    type: string
    pattern: ^[12][7890]\d\d-[01]\d-[0123]\d$
  modularDate:
    type: object
    required: [year]
    properties:
      year:
        $ref: "#/$defs/publicationYear"
      month:
        type: integer
        minimum: 1
        maximum: 12
      months:
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 12
      day:
        type: integer
        minimum: 1
        maximum: 31
      season:
        type: string
        enum: [spring, summer, fall, autumn, winter]
    if:
      required: [day]
    then:
      required: [month]
      oneOf:
      - properties:
          month:
            const: 2
          day:
            maximum: 28
      - properties:
          month:
            anyOf:
            - const: 4
            - const: 6
            - const: 9
            - const: 11
          day:
            maximum: 30
      - properties:
          month:
            anyOf:
            - const: 1
            - const: 3
            - const: 5
            - const: 7
            - const: 8
            - const: 10
            - const: 12
          day:
            maximum: 31
