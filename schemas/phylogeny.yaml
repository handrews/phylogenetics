$schema: https://json-schema.org/draft/2020-12/schema
$id: phylogeny

$defs:
  sourceId:
    type: string
    pattern: ^([12][7890]\d\d[a-z]?|inprep)_[a-z][\w._ -]+$
  authorId:
    type: string
    pattern: ^[\w][\w._ -]*$
  authors:
    type: object
    minProperties: 1
    propertyNames:
      $ref: "#/$defs/authorId"
    additionalProperties:
      $ref: "#/$defs/person"
  publications:
    type: object
    minProperties: 1
    propertyNames:
      pattern: ^[a-z0-9][-a-z0-9]*$
    additionalProperties:
      $ref: "#/$defs/publication"
  sources:
    type: object
    minProperties: 1
    propertyNames:
      $ref: "#/$defs/sourceId"
    additionalProperties:
      $ref: "#/$defs/article"
  taxa:
    type: object
    additionalProperties:
      $ref: "#/$defs/taxonRecord"
  treeDocument:
    type: object
    additionalProperties: false
    properties:
      taxonomies:
        type: array
        items:
          $ref: taxonomyTree
      phylogenies:
        type: array
        items:
          $ref: "#/$defs/phylogeny"
      assumptions:
        type: array
        items:
          $ref: taxonomyTree
      contexts:
        description: |
          Contexts shared by several nodes of this source, stated once and
          referred to by key from material entries.
        $ref: "#/$defs/contexts"
      unused:
        description: |
          Fields the source uses nowhere, so no node need carry a null for
          them (roadmap G11). A listed field appears on no node of the file.
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [material, illustrations, contexts, ranges, synonyms]
      repositories:
        description: |
          The `repositories.yaml` entries this source's catalog numbers draw
          on, listed when a printed prefix is claimed by more than one entry
          (Bell 1976 writes UCMP for Cincinnati: `[u-cincinnati-museum]`). A
          prefix
          resolves against the listed entries first, then the whole
          registry; a prefix still ambiguous, or a listed entry no number
          uses, is an error.
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/repositoryKey"
      notes:
        type: string
  person:
    type: object
    anyOf:
    - required: [surname]
    - required: [given]
    properties:
      surname:
        type: string
      given:
        type: string
      suffix:
        type: string
      birth:
        type: integer
        minimum: 1600
        maximum: 2100
      death:
        type: [integer, "null"]
        minimum: 1700
        maximum: 2100
  publication:
    type: object
    required: [name]
    unevaluatedProperties: false
    properties:
      type:
        type: string
        enum:
        - journal
        - book
        default: journal
      name:
        type: string
      publisher:
        type: string
      place:
        type: string
      notes:
        type: string
      editors:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/authorId"
  article:
    type: object
    required: [authors]
    oneOf:
    - required: [journal, title, pubDate]
    - required: [book, pubDate]
    - required: [reading, title, pubDate]
    - required: [inPrep]  # Allow for a never-published untitled source
    unevaluatedProperties: false
    properties:
      seen:
        type: boolean
        default: true
      inPrep:
        description: |
          Indicates that the authority is an unpublished "in-preparation"
          paper; any names are nomen nudum unless/until publication.
        type: boolean
        default: false
      audit:
        description: |
          Two axes, both claims made after reading the paper. `state` says
          whether what is entered was checked against the page (verification).
          `coverage` says, per kind of statement, whether everything the paper
          prints of that kind is entered (completeness); it is only meaningful
          once the source is at least partially audited, and an unaudited
          source carries none. A user's confidence in an answer is the
          conjunction: audited, and complete for the kinds the question
          touches. For a source whose tree writes nulls (roadmap G11),
          `material`, `occurrences`, `illustrations` and `synonymy` are
          derived from the tree and are not declared; `coverage` then
          carries `skeleton`, `newTaxa`, `types` and `phylogeny`.
        type: object
        additionalProperties: false
        required: [state]
        properties:
          state:
            type: string
            enum: [complete, partial, unaudited, unauditable, unobtainable]
          coverage:
            type: object
            propertyNames:
              enum:
              - skeleton
              - newTaxa
              - types
              - synonymy
              - material
              - occurrences
              - illustrations
              - phylogeny
            additionalProperties:
              type: string
              enum: [all, partly, none, na]
          notes:
            type: string
      journal:
        type: string
      book:
        type: string
      reading:
        type: string
      series:
        type: [integer, string]
        $comment: Intended for journals that reset volume numbering.
      volume:
        type: [integer, string]
        minimum: 1
      number:
        type: [integer, string]
        minimum: 1
      articleNumber:
        type: [integer, string]
        minimum: 1
      chapter:
        type: [integer, string]
      pages:
        $comment: Page numbers alternate start and end of ranges.
        type: array
        items:
          type: [integer, string]
        minItems: 2
      plates:
        $comment: Plate numbers alternate start and end of ranges.
        type: array
        items:
          type: [integer, string]
      title:
        type: string
      translations:
        additionalProperties:
          type: string
      authors:
        type: array
        minItems: 1
        items:
          type: string
      editors:
        type: array
        minItems: 1
        items:
          type: string
      pubDate:
        $ref: "#/$defs/modularDate"
        unevaluatedProperties: false
      processDates:
        type: object
        additionalProperties: false
        properties:
          submitted:
            $ref: "#/$defs/simpleDate"
          received:
            $ref: "#/$defs/simpleDate"
          revised:
            $ref: "#/$defs/simpleDate"
          accepted:
            $ref: "#/$defs/simpleDate"
          transmitted:
            $ref: "#/$defs/simpleDate"
          online:
            $ref: "#/$defs/simpleDate"
          published:
            $ref: "#/$defs/simpleDate"
          printed:
            $ref: "#/$defs/simpleDate"
          issued:
            $ref: "#/$defs/simpleDate"
          read:
            $ref: "#/$defs/simpleDate"
          conferenceStart:
            $ref: "#/$defs/simpleDate"
          conferenceEnd:
            $ref: "#/$defs/simpleDate"
          unknown:
            $ref: "#/$defs/simpleDate"
      translationOf:
        type: string
      identifiers:
        type: object
        additionalProperties: false
        properties:
          url:
            type: string
            format: iri
          doi:
            type: string
          jstor:
            type: integer
            minimum: 1
      quotes:
        type: array
        items:
          type: string
      notes:
        type: string
  authority:
    type: object
    required: [source]
    unevaluatedProperties: false
    properties:
      source:
        $ref: "#/$defs/sourceId"
      attributedTo:
        $comment: |
          The authors credited with the taxon, when they differ from the authors
          of `source` -- in which case `source` is the publication the name
          appeared *in*, rather than the work being credited.
        type: array
        items:
          type: string
      ex:
        $ref: "#/$defs/authority"
      pages:
        $ref: "#/$defs/citationNumbers"
      illustrations:
        type: array
        items:
          $ref: "#/$defs/illustration"
      notes:
        type: string
  rank:
    type: string
    enum:
    - Domain
    - Kingdom
    - Subkingdom
    - Superphylum
    - Phylum
    - Subphylum
    - Infraphylum
    - Superclass
    - Class
    - Subclass
    - Infraclass
    - Parvclass
    - Superorder
    - Order
    - Suborder
    - Superfamily
    - Family
    - Subfamily
    - genus
    - subgenus
    - species
    - subspecies
    - variety
    - Division
    - section
    - Branch
    - Group
    - Grade
    - Clade
    - Plesion
    - Scion
    - Unranked

  citationFields:
    properties:
      rank:
        $ref: "#/$defs/rank"
      bracket:
        ### TODO: Replace this property name
        type: string
    allOf:
    - $ref: "#/$defs/authorityFields"
    - $ref: "#/$defs/locationFields"

  authorityFields:
    properties:
      authority:
        $ref: "#/$defs/authority"
      auth:
        type: array
        items:
          type: string
      year:
        $ref: "#/$defs/publicationYear"
      in:
        type: array
        minItems: 1
        items:
          type: string

  locationFields:
    properties:
      pages:
        $ref: "#/$defs/citationNumbers"
      illustrations:
        description: |
          On a primary node, the figures this source prints for it; `null`
          says the source prints no figure for the node (roadmap G11). On a
          cited entry, locators for a figure in the cited work; `null` is
          not allowed there (the loader checks that).
        type: [array, "null"]
        items:
          $ref: "#/$defs/illustration"

  cladisticFields:
    properties:
      matrix:
        $comment: Character states; strings carry `?` for missing data.
        type: array
        items:
          type: [integer, string]
      outgroup:
        type: boolean
        default: false
      data:
        type: object
        additionalProperties:
          type: integer
      bootstrap:
        type: integer

  taxonRecord:
    type: object
    $ref: "#/$defs/citationFields"
    unevaluatedProperties: false
    if:
      oneOf:
      - required: [auth]
      - required: [authority]
    then:
      required: [name]
    else:
      oneOf:
      - required: [altRankOf, rank]
      - required: [altSpellingOf, name]
      - required: [vulgarSpellingOf, name]
    properties:
      name:
        type: [string, "null"]
        pattern: ^[\w][\w._ -]*$
      designation:
        description: |
          The phrase given in place of a name for taxa in open nomenclature
      needsQualification:
        type: boolean
        default: false
      originalParent:
        type: string
      status:
        type: string
      altRankOf:
        type: string
      altSpellingOf:
        type: string
      vulgarSpellingOf:
        type: string
      lang:
        type: string
        minLength: 2
        maxLength: 2
      homonym:
        type: boolean
        default: false
      holotype:
        $comment: |
          Survives for one record, grayae_bather_1915, whose protologue
          (1915b_bather) has no tree; every other holotype is a `material`
          entry on the protologue node.
        type: object
        additionalProperties:
          type: array
          items:
            type: [array, string, integer]
            items:
              type: [string, integer]
      notes:
        type: string

  tree:
    $id: tree
    $dynamicAnchor: tree
    type: object
    allOf:
    - $ref: "phylogeny#/$defs/identificationFields"
    - $ref: "phylogeny#/$defs/citationFields"
    - $ref: "phylogeny#/$defs/uncertaintyFields"
    - $ref: "phylogeny#/$defs/metaFields"
    properties:
      mergeInto:
        type: array
        minItems: 2
        maxItems: 2
        prefixItems:
        - $ref: "phylogeny#/$defs/sourceId"
        - type: integer
          minimum: 0
      children:
        type: array
        items:
          $dynamicRef: "#tree"
      parents:
        type: array
        items:
          $dynamicRef: "#tree"
      altPlacements:
        type: array
        items:
          $dynamicRef: "#tree"

  identificationFields:
    properties:
      taxon:
        type: string
      openTaxon:
        type: string
      cf:
        description: |
          The taxon this open form is compared with, "cf." for a provisional
          identification; only on an `openTaxon` node.
        type: string
      aff:
        description: |
          The taxon this open form is compared with, "aff." for a form the
          source thinks new and related; only on an `openTaxon` node.
        type: string
      citedAs:
        description: |
          A bibliographic reference exactly as printed in the source being
          transcribed, including any errors or OCR artifacts.  Used for synonymy
          lists, where the point is to record what that paper listed.  The
          citation's own attribution goes in `authority` when the work has a
          record in sources.yaml, or in `auth`/`year` when it does not.
        type: string

  uncertaintyFields:
    properties:
      provisional:
        description: The assignment to the parent taxon is provisional.
        type: boolean
        default: false
      questionable:
        description: The taxon itself is doubtful, whether or not this source erects it.
        type: boolean
        default: false
      tentative:
        description: The list author's doubt about a synonymy entry.
        type: boolean
        default: false
      quoted:
        description: |
          The node's own name is printed in quotation marks; the reason goes
          in `notes`.
        type: boolean
        default: false
      quotedParent:
        description: |
          On a species-level node, the genus is printed in quotation marks in
          this combination ("Totiglobus" lloydi): a hedge on the species'
          assignment to its genus, like `provisional`.
        type: boolean
        default: false
      nonMonophyletic:
        description: |
          The source says the group is not monophyletic: `true`, or
          `paraphyletic` or `polyphyletic` when it says which. Present is a
          statement; absent says nothing.
        oneOf:
        - const: true
        - type: string
          enum: [paraphyletic, polyphyletic]
      sensu:
        description: |
          A printed "s. s." / "s. l." / "s. em." qualifying the name as this
          source uses it.
        type: string
        enum: [stricto, lato, emendato]

  metaFields:
    properties:
      editorial:
        $ref: "#/$defs/editorialObject"
      notes:
        type: string

  taxonomyTree:
    $id: taxonomyTree
    $dynamicAnchor: tree
    $ref: "phylogeny#/$defs/baseTaxonomyTree"
    unevaluatedProperties: false

  baseTaxonomyTree:
    allOf:
    - $ref: tree
    - $ref: "#/$defs/actAndModifierFields"
    - $ref: "#/$defs/relationalFields"
    - $ref: "#/$defs/materialsFields"

  actAndModifierFields:
    properties:
      type:
        type: boolean
        default: false
      new:
        type: boolean
        default: false
      pars:
        type: boolean
        default: false
      nudum:
        $comment: The cited usage is a nomen nudum, as this source says.
        type: boolean
        default: false
      stem:
        type: boolean
        default: false
      emended:
        description: |
          The diagnosis is emended, by this source (`true`) or, when `by`
          names another work, as done there and followed here.
        oneOf:
        - type: boolean
        - $ref: "#/$defs/citedAct"
      recombined:
        description: |
          Combinatio nova: the source prints this species-group name in a
          new genus as its act ("comb. nov."), or, when `by` names another
          work, follows the recombination made there. Pair it with
          `moved` when the source names the genus the name leaves.
        oneOf:
        - type: boolean
        - $ref: "#/$defs/citedAct"
      translated:
        description: |
          Nomen translatum: the name is used at another rank than the one
          it was proposed at.  `true` when the earlier rank is not stated;
          otherwise the node names the taxon at the earlier rank, with the
          node's citation fields locating that earlier use as this source
          cites it.  The act is this source's unless `by` names the work
          that made it.
        oneOf:
        - type: boolean
        - $ref: "#/$defs/translatedNode"

  relationalFields:
    properties:
      synonyms:
        description: |
          The names this source lists as synonyms of the node's; `null`
          says the source prints no synonymy for the node (an auditor's
          statement, roadmap G11; the loader rejects it on a cited entry
          and beside a `non` list).
        type: [array, "null"]
        items:
          $ref: taxonomyTree
      non:
        type: array
        items:
          $ref: taxonomyTree
      or:
        type: array
        items:
          $ref: taxonomyTree
      # Nodes under these fields state the previous state of the name as
      # this source cites it (their citation fields locate that earlier
      # use); the change itself is this source's act.
      removed:
        type: array
        items:
          $ref: taxonomyTree
      moved:
        $ref: taxonomyTree
      corrected:
        $ref: taxonomyTree
      # A replacement name ("nom. subst.", "nom. nov."): the node under it
      # is the preoccupied or otherwise unavailable name this source replaces.
      substituted:
        $ref: taxonomyTree
      # A slip of the pen ("lapsus calami"): the node under it is the name
      # this source printed in error for the node's own, which is the name
      # intended. Not an earlier state, not a synonym, and not an available
      # name, so it occupies nothing; its place here is its protologue.
      lapsus:
        $ref: taxonomyTree
      # On a `synonyms` or `non` entry whose own name is a lapsus: the node
      # under it names the record the slip was printed for. The entry is
      # listed as the source prints it, but it is not a synonymy link.
      lapsusFor:
        $ref: taxonomyTree

  materialsFields:
    properties:
      material:
        description: |
          This source's specimens for the node, one entry each; `null` when
          the source cites none (an auditor's statement, roadmap G11).
        type: [array, "null"]
        items:
          $ref: "#/$defs/materialEntry"
      contexts:
        $ref: "#/$defs/contexts"
      ranges:
        type: [array, "null"]
        items:
          $ref: "#/$defs/range"

  citedAct:
    $comment: |
      An act this source follows rather than performs; `by` cites the work
      that performed it, with its pages.
    type: object
    additionalProperties: false
    required: [by]
    properties:
      by:
        $ref: "#/$defs/authority"

  translatedNode:
    $ref: "#/$defs/baseTaxonomyTree"
    unevaluatedProperties: false
    properties:
      by:
        $ref: "#/$defs/authority"

  phylogenyTree:
    $id: phylogenyTree
    $dynamicAnchor: tree
    unevaluatedProperties: false
    allOf:
    - $ref: tree
    - $ref: "phylogeny#/$defs/cladisticFields"

  phylogeny:
    type: object
    required: [tree, treeType]
    additionalProperties: false
    properties:
      treeType:
        type: string
        enum:
        - taxonomy
        - cladogram
        - diagram
        - other
      tree:
        $ref: phylogenyTree
      notes:
        type: string
      methodology:
        type: string
      characteristics:
        type: array
        items:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: [integer, string]
  citationNumber:
    $comment: |
      Page, plate, figure and specimen "numbers" share one value space.  They are
      often not integers: Roman numerals (LI), dot-separated sequences that are
      version-like rather than decimal (10.1), and letter-suffixed forms (S637,
      2D) all occur.  Fields keep `string` even where every current value happens
      to be an integer.
    type: [integer, string]
  citationNumbers:
    description: |
      One or more citation numbers or ranges.  A bare number is shorthand for a
      single-entry list, so `pages: 52` and `pages: [52]` mean the same thing.
      This replaces the former singular/plural field pairs (`page`/`pages`,
      `figure`/`figures`, `textFigure`/`textFigures`), which existed only so a
      lone number need not be written as a one-element array.
    anyOf:
    - $ref: "#/$defs/citationNumber"
    - $ref: "#/$defs/multiRanges"
  multiRanges:
    description: |
      A list of distinct citation numbers or ranges.  A range is specified
      by a two-element list in the top-level list.  Therefore
      the array [42, 88] as page numbers means that the information appears
      on page 42 and 88, but not the pages in between, while [[42, 88]] means
      that the information appears on the range of pages from 42 to 88
      inclusive.  The value [10, [42, 88]] would indicate information
      appearing on page 10 and also the range from 42 to 88 inclusive.
    type: array
    items:
      anyOf:
      - $ref: "#/$defs/citationNumber"
      - type: array
        minItems: 2
        maxItems: 2
        items:
          $ref: "#/$defs/citationNumber"
  figureLocatorFields:
    properties:
      plate:
        $ref: "#/$defs/citationNumber"
      page:
        $ref: "#/$defs/citationNumber"
      figures:
        $ref: "#/$defs/citationNumbers"
      textFigures:
        $ref: "#/$defs/citationNumbers"
      non:
        description: Figures the locator excludes or corrects ("figs. 1–5, non fig. 6").
        $ref: "#/$defs/citationNumbers"
      notes:
        type: string
  illustration:
    description: |
      A figure printed in this source when on a primary node (`of` names the
      material entry it depicts, by a catalog number or label on the same
      node; none means the source never ties it to a specimen), or a locator
      for a figure in the cited work when on a cited entry or inside
      `authority`, where `of` and `depicts` are not allowed (the loader
      checks that).
    type: object
    $ref: "#/$defs/figureLocatorFields"
    unevaluatedProperties: false
    anyOf:
    - required: [plate]
    - required: [page]
    - required: [figures]
    - required: [textFigures]
    properties:
      of:
        oneOf:
        - type: string
        - type: array
          minItems: 1
          items:
            type: string
      depicts:
        type: string
        enum: [specimen, cast, reconstruction, drawing]
        default: specimen
      uncertain:
        description: |
          If true, the assignment of the figured specimen to the taxon is
          uncertain, but no other identifiable taxon was named.
        type: boolean
        default: false

  editorialObject:
    description: |
      The editor's layer beside the printed fields, never a replacement
      for them. `corrections` says what the editor judges wrong on the
      printed line and what to read instead: merging it into the node as
      a JSON Merge Patch produces the corrected record, so every key it
      touches is a field in error, however deep. `inferred` marks a node
      whose existence or placement is the editor's, not the source's, or
      names the fields that are, when the node is printed. Not for an
      apparently-intentional change of spelling, which is tracked as an
      `altSpellingOf` record.
    type: object
    additionalProperties: false
    required: [basis]
    anyOf:
    - required: [inferred]
    - required: [corrections]
    properties:
      inferred:
        description: |
          `true` when the node's existence or placement is the editor's;
          a list of field names when only those fields are inferred and
          the node itself is printed.
        type: [boolean, array]
        items:
          type: string
      corrections:
        description: |
          A JSON Merge Patch (RFC 7396) over the node: applying it to the
          node, with the editorial block left out, produces the record as
          the editor reads it. A key set to null deletes a printed field
          that is wrong with nothing known to put in its place; a nested
          object corrects inside `authority` or another block; an array
          (`illustrations`) is replaced whole, so restate it in full.
        # TODO: Probably nest entire the parent object here, but with no
        #       required fields? Recursively? This will do for now.
        type: object
        properties:
          authority:
            type: object
            properties:
              source:
                $ref: "#/$defs/sourceId"
        additionalProperties: true
      basis:
        description: |
          Explains why the editorial block is present, with sufficient
          information for a researcher to determine whether the inference
          or error judgement is correct, or to look up relevant sources.
        type: string
  eon:
    type: string
    enum:
    - Hadean
    - Archean
    - Proterozoic
    - Phanerozoic
  era:
    type: string
    enum:
    - Eoarchean
    - Paleoarchean
    - Mesoarchean
    - Neoarchean
    - Paleoproterozoic
    - Mesoproterozoic
    - Neoproterozoic
    - Paleozoic
    - Mesozoic
    - Cenozoic
  period:
    type: string
    enum:
    - Siderian
    - Rhyacian
    - Orosirian
    - Statherian
    - Calymmian
    - Ectasian
    - Stenian
    - Tonian
    - Cryogenian
    - Ediacaran
    - Cambrian
    - Ordovician
    - Silurian
    - Devonian
    - Carboniferous
    - Permian
    - Triassic
    - Jurassic
    - Cretaceous
    - Paleogene
    - Neogene
    - Quaternary
  localSeries:
    type: string
  localSeriesRange:
    type: array
    items:
      $ref: "#/$defs/localSeries"
    minItems: 2
    maxItems: 2
  seriesRange:
    type: array
    items:
      $ref: "#/$defs/series"
    minItems: 2
    maxItems: 2
  series:
    type: string
    enum:
    - Terrenuevian
