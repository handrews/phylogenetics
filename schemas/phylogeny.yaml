$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  publications:
    type: array
    items:
      $ref: "#/$defs/publication"
  articles:
    type: array
    items:
      $ref: "#/$defs/article"
$defs:
  person:
    type: object
    required: [id]
    anyOf:
    - required: [family]
    - required: [given]
    properties:
      id:
        type: string
      family:
        type: string
      given:
        type: string
      suffix:
        type: string
      birth:
        $ref: "#/$defs/modularDate"
      death:
        oneOf:
        - $ref: "#/$defs/modularDate"
        - type: "null"
  publication:
    type: object
    required: [id, name]
    unevaluatedProperties: false
    properties:
      id:
        type: string
      type:
        type: string
        enum:
        - journal
        - book
        default: journal
      name:
        type: string
      publisher:
        type: string
      notes:
        type: string
  article:
    type: object
    required: [id, pubId, authorids, title]
    unevaluatedProperties: false
    properties:
      id:
        type: string
      journal:
        type: string
      book:
        type: string
      volume:
        type: number
      issue:
        type: number
      article:
        type: string
      pages:
        type: array
          items:
            type: [integer, string]
          minItems: 2
          maxItems: 2
      title:
        type: string
      authors:
        type: array
        minItems: 1
        items:
          type: string
      pubDate:
        $ref: "#/$defs/modularDate"
        unevaluatedProperties: false
      processDates:
        type: object
        additionalProperties: false
        properties:
          submitted:
            $ref: "#/$defs/simpleDate"
          received:
            $ref: "#/$defs/simpleDate"
          revised:
            $ref: "#/$defs/simpleDate"
          accepted:
            $ref: "#/$defs/simpleDate"
          online:
            $ref: "#/$defs/simpleDate"
      identifiers:
        type: object
        additionalProperties: false
        properties:
          url:
            type: string
            format: iri
          doi:
            type: string
          jstor:
            type: integer
            minimum: 1
      quotes:
        type: array
        items:
          type: string
      notes:
        type: string
  tree:
    $id: tree
    $dynamicAnchor: tree
    type: object
    properties:
      taxon:
        type: string
      type:
        type: boolean
        default: false
      new:
        type: boolean
        default: false
      children:
        type: array
        items:
          $dynamicRef: tree
  taxonomy:
    $ref: taxonomyTree
  taxonomyTree:
    $id: taxonomyTree
    $dynamicAnchor: tree
    $ref: tree
    properties:
      specimens:
        type: array
          items:
            $ref: "#/$defs/specimen"
    unevaluatedProperties: false
  phylogeny:
    type: object
    properties:
      type:
        type: string  # Enum?  Meh.
      tree:
        $ref: tree
  phylogenyTree:
    $id: phylogenyTree
    $dynamicAnchor: tree
    $ref: tree
    properties:
      data:
        type: object
        additionalProperties:
          type: number
      categories:
        type: array
        items:
          type: string
  simpleDate:
    type: string
    pattern: ^[12][7890][\d\d]-[01]\d-[0123]\d$
  modularDate:
    type: object
    required: [year]
    properties:
      year:
        type: integer
        minimum: 1700 # Linnaeus was born in 1707
        maximum: 2030
      month:
        type: integer
        minimum: 1
        maximum: 12
      day:
        type: integer
        minimum: 1
    oneOf:
    - properties:
        month:
          const: 2
        day:
          maximum: 28
    - properties:
        month:
          anyOf:
          - const: 4
          - const: 6
          - const: 9
          - const: 11
        day:
          maximum: 30
    - properties:
        month:
          anyOf:
          - const: 1
          - const: 3
          - const: 5
          - const: 7
          - const: 8
          - const: 10
          - const: 12
        day:
          maximum: 31
