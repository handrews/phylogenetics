$schema: https://json-schema.org/draft/2020-12/schema
$id: phylogeny

$defs:
  sourceId:
    type: string
    pattern: ^([12][7890]\d\d[a-z]?|inprep)_[a-z][\w._ -]+$
  authorId:
    type: string
    pattern: ^[\w][\w._ -]*$
  authors:
    type: object
    minProperties: 1
    propertyNames:
      $ref: "#/$defs/authorId"
    additionalProperties:
      $ref: "#/$defs/person"
  publications:
    type: object
    minProperties: 1
    propertyNames:
      pattern: ^[a-z0-9][-a-z0-9]*$
    additionalProperties:
      $ref: "#/$defs/publication"
  sources:
    type: object
    minProperties: 1
    propertyNames:
      $ref: "#/$defs/sourceId"
    additionalProperties:
      $ref: "#/$defs/article"
  taxa:
    type: object
    additionalProperties:
      $ref: "#/$defs/taxonRecord"
  trees:
    type: object
    propertyNames:
      $ref: "#/$defs/sourceId"
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        source:
          $ref: "#/$defs/sourceId"
        taxonomies:
          type: array
          items:
            $ref: "#/$defs/taxonomyTree"
        phylogenies:
          type: array
          items:
            $ref: "#/$defs/phylogeny"
        assumptions:
          type: array
          items:
            $ref: "#/$defs/taxonomyTree"
        notes:
          type: string
  person:
    type: object
    anyOf:
    - required: [surname]
    - required: [given]
    properties:
      surname:
        type: string
      given:
        type: string
      suffix:
        type: string
      birth:
        type: integer
        minimum: 1600
        maximum: 2100
      death:
        type: [integer, "null"]
        minimum: 1700
        maximum: 2100
  publication:
    type: object
    required: [name]
    unevaluatedProperties: false
    properties:
      type:
        type: string
        enum:
        - journal
        - book
        default: journal
      name:
        type: string
      publisher:
        type: string
      place:
        type: string
      notes:
        type: string
      editors:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/authorId"
  article:
    type: object
    required: [authors]
    oneOf:
    - required: [journal, title, pubDate]
    - required: [book, pubDate]
    - required: [reading, title, pubDate]
    - required: [inPrep]  # Allow for a never-published untitled source
    unevaluatedProperties: false
    properties:
      seen:
        type: boolean
        default: true
      inPrep:
        description: |
          Indicates that the authority is an unpublished "in-preparation"
          paper; any names are nomen nudum unless/until publication.
        type: boolean
        default: false
      audit:
        description: |
          Two axes, both claims made after reading the paper. `state` says
          whether what is entered was checked against the page (verification).
          `coverage` says, per kind of statement, whether everything the paper
          prints of that kind is entered (completeness); it is only meaningful
          once the source is at least partially audited, and an unaudited
          source carries none. A user's confidence in an answer is the
          conjunction: audited, and complete for the kinds the question
          touches.
        type: object
        additionalProperties: false
        required: [state]
        properties:
          state:
            type: string
            enum: [complete, partial, unaudited, unauditable, unobtainable]
          coverage:
            type: object
            propertyNames:
              enum:
              - skeleton
              - newTaxa
              - types
              - synonymy
              - material
              - occurrences
              - illustrations
              - diagnoses
              - phylogeny
            additionalProperties:
              type: string
              enum: [all, partly, none, na]
          notes:
            type: string
      journal:
        type: string
      book:
        type: string
      reading:
        type: string
      series:
        type: [integer, string]
        $comment: Intended for journals that reset volume numbering.
      volume:
        type: [integer, string]
        minimum: 1
      number:
        type: [integer, string]
        minimum: 1
      articleNumber:
        type: [integer, string]
        minimum: 1
      chapter:
        type: [integer, string]
      pages:
        $comment: Page numbers alternate start and end of ranges.
        type: array
        items:
          type: [integer, string]
        minItems: 2
      plates:
        $comment: Plate numbers alternate start and end of ranges.
        type: array
        items:
          type: [integer, string]
      title:
        type: string
      translations:
        additionalProperties:
          type: string
      authors:
        type: array
        minItems: 1
        items:
          type: string
      editors:
        type: array
        minItems: 1
        items:
          type: string
      pubDate:
        $ref: "#/$defs/modularDate"
        unevaluatedProperties: false
      processDates:
        type: object
        additionalProperties: false
        properties:
          submitted:
            $ref: "#/$defs/simpleDate"
          received:
            $ref: "#/$defs/simpleDate"
          revised:
            $ref: "#/$defs/simpleDate"
          accepted:
            $ref: "#/$defs/simpleDate"
          transmitted:
            $ref: "#/$defs/simpleDate"
          online:
            $ref: "#/$defs/simpleDate"
          published:
            $ref: "#/$defs/simpleDate"
          printed:
            $ref: "#/$defs/simpleDate"
          issued:
            $ref: "#/$defs/simpleDate"
          read:
            $ref: "#/$defs/simpleDate"
          conferenceStart:
            $ref: "#/$defs/simpleDate"
          conferenceEnd:
            $ref: "#/$defs/simpleDate"
          unknown:
            $ref: "#/$defs/simpleDate"
      translationOf:
        type: string
      identifiers:
        type: object
        additionalProperties: false
        properties:
          url:
            type: string
            format: iri
          doi:
            type: string
          jstor:
            type: integer
            minimum: 1
      quotes:
        type: array
        items:
          type: string
      notes:
        type: string
  authority:
    type: object
    required: [source]
    unevaluatedProperties: false
    properties:
      source:
        $ref: "#/$defs/sourceId"
      attributedTo:
        $comment: |
          The authors credited with the taxon, when they differ from the authors
          of `source` -- in which case `source` is the publication the name
          appeared *in*, rather than the work being credited.
        type: array
        items:
          type: string
      ex:
        $ref: "#/$defs/authority"
      pages:
        $ref: "#/$defs/citationNumbers"
      illustrations:
        type: array
        items:
          $ref: "#/$defs/illustration"
      notes:
        type: string
  rank:
    type: string
    enum:
    - Domain
    - Kingdom
    - Subkingdom
    - Superphylum
    - Phylum
    - Subphylum
    - Infraphylum
    - Superclass
    - Class
    - Subclass
    - Infraclass
    - Parvclass
    - Superorder
    - Order
    - Suborder
    - Superfamily
    - Family
    - Subfamily
    - genus
    - subgenus
    - species
    - subspecies
    - variety
    - Division
    - section
    - Branch
    - Group
    - Grade
    - Clade
    - Plesion
    - Scion
    - Unranked

  citationFields:
    properties:
      rank:
        $ref: "#/$defs/rank"
      bracket:
        ### TODO: Replace this property name
        type: string

      # AUTHORITY FIELDS
      authority:
        $ref: "#/$defs/authority"
      auth:
        type: array
        items:
          type: string
      year:
        $ref: "#/$defs/publicationYear"
      in:
        type: array
        minItems: 1
        items:
          type: string

      # SUPPORTING LOCATION FIELDS
      pages:
        $ref: "#/$defs/citationNumbers"
      illustrations:
        type: array
        items:
          $ref: "#/$defs/illustration"
  cladisticFields:
    properties:
      matrix:
        $comment: Character states; strings carry `?` for missing data.
        type: array
        items:
          type: [integer, string]
      outgroup:
        type: boolean
        default: false
      data:
        type: object
        additionalProperties:
          type: integer
      bootstrap:
        type: integer
  taxonRecord:
    type: object
    $ref: "#/$defs/citationFields"
    unevaluatedProperties: false
    if:
      oneOf:
      - required: [auth]
      - required: [authority]
    then:
      required: [name]
    else:
      oneOf:
      - required: [altRankOf, rank]
      - required: [altSpellingOf, name]
      - required: [vulgarSpellingOf, name]
    properties:
      name:
        type: [string, "null"]
        pattern: ^[\w][\w._ -]*$
      designation:
        description: |
          The phrase given in place of a name for taxa in open nomenclature
      needsQualification:
        type: boolean
        default: false
      originalParent:
        type: string
      status:
        type: string
      altRankOf:
        type: string
      altSpellingOf:
        type: string
      vulgarSpellingOf:
        type: string
      lang:
        type: string
        minLength: 2
        maxLength: 2
      homonym:
        type: boolean
        default: false
      holotype:
        type: object
        additionalProperties:
          type: array
          items:
            type: [array, string, integer]
            items:
              type: [string, integer]
      notes:
        type: string
  tree:
    type: object
    $ref: "#/$defs/citationFields"
    properties:
      mergeInto:
        type: array
        minItems: 2
        maxItems: 2
        prefixItems:
        - $ref: "#/$defs/sourceId"
        - type: integer
          minimum: 0

      # IDENTIFICATION FIELDS
      taxon:
        type: string
      affTaxon:
        type: string
      cfTaxon:
        type: string
      openTaxon:
        type: string
      citedAs:
        description: |
          A bibliographic reference exactly as printed in the source being
          transcribed, including any errors or OCR artifacts.  Used for synonymy
          lists, where the point is to record what that paper listed.  The
          citation's own attribution goes in `authority` when the work has a
          record in sources.yaml, or in `auth`/`year` when it does not.
        type: string
      diagnosis:
        type: [string, "null"]

      # UNCERTAINTY FIELDS
      provisional:
        $comment: The assignment to parent taxon is provisional
        type: boolean
        default: false
      questionable:
        $comment: The current taxon is questionable
        type: boolean
        default: false
      tentative:
        $comment: For synonyms / non
        type: boolean
        default: false
      quoted:
        type: boolean
        default: false
      sensu:
        description: |
          A printed "s. s." / "s. l." / "s. em." qualifying the name as this
          source uses it.
        type: string
        enum: [stricto, lato, emendato]

      # META FIELDS
      editorial:
        $ref: "#/$defs/editorialObject"
      notes:
        type: string
  taxonomyTree:
    $ref: "#/$defs/tree"
    unevaluatedProperties: false
    properties:
      # ACT AND MODIFIER FIELDS
      type:
        type: boolean
        default: false
      new:
        type: boolean
        default: false
      pars:
        type: boolean
        default: false
      nudum:
        $comment: The cited usage is a nomen nudum, as this source says.
        type: boolean
        default: false
      stem:
        type: boolean
        default: false
      emended:
        description: |
          The diagnosis is emended, by this source (`true`) or, when `by`
          names another work, as done there and followed here.
        oneOf:
        - type: boolean
        - $ref: "#/$defs/citedAct"
      translated:
        description: |
          Nomen translatum: the name is used at another rank than the one
          it was proposed at.  `true` when the earlier rank is not stated;
          otherwise the node names the taxon at the earlier rank, with the
          node's citation fields locating that earlier use as this source
          cites it.  The act is this source's unless `by` names the work
          that made it.
        oneOf:
        - type: boolean
        - $ref: "#/$defs/translatedNode"

      # RELATIONAL FIELDS
      children:
        type: array
        items:
          $ref: "#/$defs/taxonomyTree"
      parents:
        type: array
        items:
          $ref: "#/$defs/taxonomyTree"
      synonyms:
        type: array
        items:
          $ref: "#/$defs/taxonomyTree"
      non:
        type: array
        items:
          $ref: "#/$defs/taxonomyTree"
      or:
        type: array
        items:
          $ref: "#/$defs/taxonomyTree"
      altPlacements:
        type: array
        items:
          $ref: "#/$defs/taxonomyTree"
      # Nodes under these fields state the previous state of the name as
      # this source cites it (their citation fields locate that earlier
      # use); the change itself is this source's act.
      removed:
        type: array
        items:
          $ref: "#/$defs/taxonomyTree"
      moved:
        $ref: "#/$defs/taxonomyTree"
      corrected:
        $ref: "#/$defs/taxonomyTree"

      # MATERIALS FIELDS
      occurrences:
        type: array
        items:
          $ref: "#/$defs/occurrence"
      specimens:
        $ref: "#/$defs/specimens"

  citedAct:
    $comment: |
      An act this source follows rather than performs; `by` cites the work
      that performed it, with its pages.
    type: object
    additionalProperties: false
    required: [by]
    properties:
      by:
        $ref: "#/$defs/authority"
  translatedNode:
    $ref: "#/$defs/tree"
    unevaluatedProperties: false
    properties:
      by:
        $ref: "#/$defs/authority"
  phylogenyTree:
    unevaluatedProperties: false
    allOf:
    - $ref: "#/$defs/tree"
    - $ref: "#/$defs/cladisticFields"
    $comment: |
      Duplicated relational properties because there doesn't seem to be
      a python JSON Schema implementation that both supports annotations
      and has a fast $dynamicRef implementation.
      Additional relational fields are absent by design as they are
      taxonomy-specific.
    properties:
      children:
        type: array
        items:
          $ref: "#/$defs/phylogenyTree"
      parents:
        type: array
        items:
          $ref: "#/$defs/phylogenyTree"
      altPlacements:
        type: array
        items:
          $ref: "#/$defs/phylogenyTree"
  phylogeny:
    type: object
    required: [tree, treeType]
    additionalProperties: false
    properties:
      treeType:
        type: string
        enum:
        - taxonomy
        - cladogram
        - diagram
        - other
      tree:
        $ref: "#/$defs/phylogenyTree"
      notes:
        type: string
      methodology:
        type: string
      characteristics:
        type: array
        items:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: [integer, string]
  citationNumber:
    $comment: |
      Page, plate, figure and specimen "numbers" share one value space.  They are
      often not integers: Roman numerals (LI), dot-separated sequences that are
      version-like rather than decimal (10.1), and letter-suffixed forms (S637,
      2D) all occur.  Fields keep `string` even where every current value happens
      to be an integer.
    type: [integer, string]
  citationNumbers:
    description: |
      One or more citation numbers or ranges.  A bare number is shorthand for a
      single-entry list, so `pages: 52` and `pages: [52]` mean the same thing.
      This replaces the former singular/plural field pairs (`page`/`pages`,
      `figure`/`figures`, `textFigure`/`textFigures`), which existed only so a
      lone number need not be written as a one-element array.
    anyOf:
    - $ref: "#/$defs/citationNumber"
    - $ref: "#/$defs/multiRanges"
  multiRanges:
    description: |
      A list of distinct citation numbers or ranges.  A range is specified
      by a two-element list in the top-level list.  Therefore
      the array [42, 88] as page numbers means that the information appears
      on page 42 and 88, but not the pages in between, while [[42, 88]] means
      that the information appears on the range of pages from 42 to 88
      inclusive.  The value [10, [42, 88]] would indicate information
      appearing on page 10 and also the range from 42 to 88 inclusive.
    type: array
    items:
      anyOf:
      - $ref: "#/$defs/citationNumber"
      - type: array
        minItems: 2
        maxItems: 2
        items:
          $ref: "#/$defs/citationNumber"
  illustration:
    type: object
    properties:
      source:
        $ref: "#/$defs/sourceId"
      plate:
        $ref: "#/$defs/citationNumber"
      page:
        $ref: "#/$defs/citationNumber"
      figures:
        $ref: "#/$defs/citationNumbers"
      textFigures:
        $ref: "#/$defs/citationNumbers"
      location:
        type: [integer, string]
      collectedFrom:
        type: string
      uncertain:
        description: |
          If true, the assignment of the specimen to the given taxon
          is uncertain, but no other identifiable taxon (such as a cf. taxon)
          was defined.
        type: boolean
        default: false
      notes:
        type: string
  basicOccurrence:
    type: object
    properties:
      eon:
        $ref: "#/$defs/eon"
      era:
        $ref: "#/$defs/era"
      period:
        $ref: "#/$defs/period"
      series:
        $ref: "#/$defs/series"
      seriesBoundary:
        $ref: "#/$defs/seriesRange"
      seriesRange:
        $ref: "#/$defs/seriesRange"
      stage:
        $ref: "#/$defs/stage"
      stageBoundary:
        $ref: "#/$defs/stageRange"
      stageRange:
        $ref: "#/$defs/stageRange"
      stageModifier:
        $ref: "#/$defs/stageModifier"
      superunit:
        type: string
      unit:
        type: [string, array]
        items:
          type: string
      subunit:
        type: string
      section:
        type: string
      biota:
        type: string
      biozone:
        type: string
      biozones:
        type: array
        items:
          type: string
        minItems: 2
      biozoneRange:
        type: array
        items:
          type: string
        minItems: 2
        maxItems: 2
      fauna:
        type: array
        items:
          type: string
      paleocontinent:
        type: string
      location:
        type: array
        items:
          type: string
      sources:
        type: array
        items:
          $ref: "#/$defs/sourceId"
      notes:
        type: string
      specimens:
        type: object
        additionalProperties:
          type: object
          items:
            type: [string, integer, array]
            items:
              type: [string, integer]
      possibleSpecimens:
        type: object
        additionalProperties:
          type: object
          items:
            type: [string, array]
            items:
              type: string
  editorialObject:
    description: |
      The editor's layer beside the printed fields, never a replacement
      for them. `corrections` says what the editor judges wrong on the
      printed line and what to read instead: merging it into the node as
      a JSON Merge Patch produces the corrected record, so every key it
      touches is a field in error, however deep. `inferred` marks a node
      whose existence or placement is the editor's, not the source's, or
      names the fields that are, when the node is printed. Not for an
      apparently-intentional change of spelling, which is tracked as an
      `altSpellingOf` record.
    type: object
    additionalProperties: false
    required: [basis]
    anyOf:
    - required: [inferred]
    - required: [corrections]
    properties:
      inferred:
        description: |
          `true` when the node's existence or placement is the editor's;
          a list of field names when only those fields are inferred and
          the node itself is printed.
        type: [boolean, array]
        items:
          type: string
      corrections:
        description: |
          A JSON Merge Patch (RFC 7396) over the node: applying it to the
          node, with the editorial block left out, produces the record as
          the editor reads it. A key set to null deletes a printed field
          that is wrong with nothing known to put in its place; a nested
          object corrects inside `authority` or another block; an array
          (`illustrations`) is replaced whole, so restate it in full.
        # TODO: Probably nest entire the parent object here, but with no
        #       required fields? Recursively? This will do for now.
        type: object
        properties:
          authority:
            type: object
            properties:
              source:
                $ref: "#/$defs/sourceId"
        additionalProperties: true
      basis:
        description: |
          Explains why the editorial block is present, with sufficient
          information for a researcher to determine whether the inference
          or error judgement is correct, or to look up relevant sources.
        type: string
  occurrence:
    $ref: "#/$defs/basicOccurrence"
    properties:
      tentative:
        type: boolean
        default: false
      localPeriod:
        type: string
      localSeries:
        $ref: "#/$defs/localSeries"
      localSeriesBoundary:
        $ref: "#/$defs/localSeriesRange"
      localSeriesRange:
        $ref: "#/$defs/localSeriesRange"
      localStage:
        $ref: "#/$defs/localStage"
      localStageBoundary:
        $ref: "#/$defs/localStageRange"
      localStageRange:
        $ref: "#/$defs/localStageRange"
      localStageModifier:
        $ref: "#/$defs/stageModifier"
      inferred:
        $ref: "#/$defs/basicOccurrence"
        unevaluatedProperties: false
    unevaluatedProperties: false
  eon:
    type: string
    enum:
    - Hadean
    - Archean
    - Proterozoic
    - Phanerozoic
  era:
    type: string
    enum:
    - Eoarchean
    - Paleoarchean
    - Mesoarchean
    - Neoarchean
    - Paleoproterozoic
    - Mesoproterozoic
    - Neoproterozoic
    - Paleozoic
    - Mesozoic
    - Cenozoic
  period:
    type: string
    enum:
    - Siderian
    - Rhyacian
    - Orosirian
    - Statherian
    - Calymmian
    - Ectasian
    - Stenian
    - Tonian
    - Cryogenian
    - Ediacaran
    - Cambrian
    - Ordovician
    - Silurian
    - Devonian
    - Carboniferous
    - Permian
    - Triassic
    - Jurassic
    - Cretaceous
    - Paleogene
    - Neogene
    - Quaternary
  localSeries:
    type: string
  localSeriesRange:
    type: array
    items:
      $ref: "#/$defs/localSeries"
    minItems: 2
    maxItems: 2
  seriesRange:
    type: array
    items:
      $ref: "#/$defs/series"
    minItems: 2
    maxItems: 2
  series:
    type: string
    enum:
    - Terrenuevian
    - Cambrian Series 2
    - Miaolingian
    - Furongian
    - Lower Ordovician
    - Middle Ordovician
    - Upper Ordovician
    - Llandovery
    - Wenlock
    - Ludlow
    - Přídolí
    - Lower Devonian
    - Middle Devonian
    - Upper Devonian
    - Lower Mississippian
    - Middle Mississippian
    - Upper Mississippian
    - Lower Pennsylvanian
    - Middle Pennsylvanian
    - Upper Pennsylvanian
    - Cisuralian
    - Guadalupian
    - Lopingian
    - Lower Triassic
    - Middle Triassic
    - Upper Triassic
    - Lower Jurassic
    - Middle Jurassic
    - Upper Jurassic
    - Lower Cretaceous
    - Upper Cretaceous
    - Paleocene
    - Eocene
    - Oligocene
    - Miocene
    - Pliocene
    - Pleistocene
    - Holocene
  localStage:
    type: string
  localStageRange:
    type: array
    items:
      $ref: "#/$defs/localStage"
    minItems: 2
    maxItems: 2
  stageRange:
    type: array
    items:
      $ref: "#/$defs/stage"
    minItems: 2
    maxItems: 2
  stageModifier:
    type: string
    enum: [lower, middle, upper]
  stage:
    type: string
    enum:
    - Fortunian
    - Cambrian Stage 2
    - Cambrian Stage 3
    - Cambrian Stage 4
    - Wuliuan
    - Drumian
    - Guzhangian
    - Paibian
    - Jiangshanian
    - Cambrian Stage 10
    - Tremadocian
    - Floian
    - Dapingian
    - Darriwilian
    - Sandbian
    - Katian
    - Hirnantian
    - Rhuddanian
    - Aeronian
    - Telychian
    - Sheinwoodian
    - Homerian
    - Gorstian
    - Ludfordian
    - Lochkovian
    - Pragian
    - Emsian
    - Eifelian
    - Givetian
    - Frasnian
    - Famennian
    - Touraisian
    - Viséan
    - Serpukhovian
    - Baskirian
    - Moscovian
