Vetulicola longbaoshanensis:
  authority: Yang et al., 2010
  files:
  - 2010-03-00-p A new vetulicoliid from lower Cambrian, Kunming, Yunnan.pdf
  occurrence:
  - Guanshan, Wulongqing Member, Lower Cambrian Canglangpu Formation
  specimens:
    complete: 4
    incomplete:
    - 2 isolated anterior parts
  length: 8.0cm, 9.4cm
  anterior:
    length: 5.0cm, 5.7cm
    width: 3.1cm, null
    section:
      shape: subrectangular in lateral view
      decoration: false
      lateral groove: true
      fin: triangular between 3rd and 4th lateral pouches
    opening:
      shape: anterior edge nearly vertical
      disc: false
    lateral pouches:
      number: 5
      shape: diamond to rounded-diamond
      contents: null
  connection:
    location: fin-like structure between  3rd and 4th pouches (4th segment)
  posterior:
    length: 4.8cm, 3.7cm
    shape: oar-like
    segments:
      number: 7
      shape: last segment "a little longer" than the others; last three segments wider in one paratype
    anus: terminal
