        notes: |
          Holzschnitt II: "Fig. 1. Ein Theil des andern Deckels von F. I, 2,
          vergrössert. Die Pyramide ist ausgefallen, bei a sieht man die
          innern Ambulacralplättchen (?). -- Fig. 2, 3. Kelche der
          Cyathocystis Plautinae von Reval, ohne Deckel; bei a Verticalfugen
