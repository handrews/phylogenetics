    - taxon: plautinae_schmidt.c.f_1879
      new: true
      isType: true
      citedAs: Cyathocystis Plautinae n. sp.
      pages: 
      - [1, 5]
      - 7
      illustrations:
      - page: 2
        textFigures:
        - [1, 3]
      - page: 4
        textFigures:
        - [1, 3]
      specimens:
        unknowntypes:
        - the two specimens figured as Holzschnitt I figs. 1 and 2, from Frau Generalin Plautin, Reval
        - the pieces figured as Holzschnitt II figs. 2 and 3, from the same collection
      occurrences:
      - unit:
        - Echinosphaerites bed
        - Estonian Glint
        location:
        - Reval
        notes: |
          My Echinosphaerites bed corresponds for the most
          part to the Swedish Chasmops limestone."
      notes: |
        Collected in summer 1878 by the family of Major-General S. A.
        Plautin at Reval; the two figured specimens and the pieces of
        Holzschnitt II 2, 3 came from the Generalin Plautin (p. 1). "der zu
        Ehren wir auch unsre Cyathocystis Plautinae benannt haben" (p. 7) --
        "in whose honour we have also named our Cyathocystis Plautinae." No
        specimen number, repository or type word is printed; "Sämmtliche
        Originalstücke gehn noch zu Prof. Lovén nach Stockholm, der sie bei
        seiner grossen Arbeit über Cystideen benutzen wird." (p. 4) -- "All
        the original pieces are still going to Prof. Lovén in Stockholm, who
        will use them in his great work on Cystids."

        The only type wording: "Die runzliche Epitheca ist eben so wie bei
        der typischen Art vorhanden" (p. 7, of C. rhizophora) -- "The
        wrinkled epitheca is present just as in the typical species."
        "Type species" is not printed; `type` here rests on that phrase.
    - taxon: rhizophora_schmidt_1879
      new: true
      citedAs: Cyathocystis rhizophora n. sp.
      pages: [2, [5, 7]]
      illustrations:
      - page: 2
        textFigures: [4]
        notes: 'Holzschnitt I: "Fig. 4. Cyathocystis rhizophora n. sp. von Wassalem, nat. Gr." (p. 2)'
      - page: 6
        textFigures: [1, 2, 3, 4]
        notes: |
          Holzschnitt III: "Cyathocystis rhizophora von Wassalem. Alles nat.
          Gr. Fig. 1. Ein Zwillingskelch mit deutlicher Epitheca. Fig. 2. Eine
          Kelchbasis oben mit dem Grunde der Höhlung und unten mit breiten
          Wurzelausläufern, bei a Löcher in d. Wand. Fig. 3. Ein gebogener
          Kelch mit seitlichen Verticalfugen und knotigen Wachsthumsansätzen
          auf den Kanten, a wie in vor. Fig. b, Verticalfuge. Fig. 4. Drei
          zusammenhängende Kelche; bei 4 b Seitendurchschnitt, an dem der
          durchgehende Kanal am Grunde sichtbar ist." (p. 6)
      specimens:
        unknowntypes:
        - several specimens collected by the author in 1863 at Wassalem, mostly delivered to the Volborth collection, now belonging to the Academy of Sciences
      occurrences:
      - unit: Jewesche Schicht
        subunit: Hemicosmitenkalk
        location:
        - Wassalem
        notes: |
          "aus dem Hemicosmitenkalk von Wassalem (in der Jeweschen Schicht
          Estlands)" (p. 5); "aus dem Hemicosmitenkalk von Wassalem (der
          obersten Stufe der Jeweschen Schicht angehörig)" (p. 7) -- "from
          the Hemicosmites limestone of Wassalem (belonging to the uppermost
          stage of the Jewe bed)". "Aehnliche Stücke wurden später auch bei
          Reval gefunden und nicht genauer beachtet" (p. 7) -- "Similar
          pieces were later also found near Reval and not examined more
          closely"; which species those are is not said.
      notes: |
        "die wir C. rhizophora (F. III, 1-4 und F. I, 4) nennen nach der
        stärkern Entwicklung ihres Wurzelapparats, mit dem sie auf allerhand
        Korallen und Bryozoen festsitzt" (p. 5) -- "which we name C.
        rhizophora after the stronger development of its root apparatus,
        with which it sits fast on all kinds of corals and bryozoans." "die
        bisher noch nie mit dem Deckel gefunden wurde" (p. 6) -- "which has so
        far never been found with the lid." Known to the author "schon seit
        längerer Zeit (seit 1863)" (p. 7). No year is printed for the name
        beyond the volume's.
