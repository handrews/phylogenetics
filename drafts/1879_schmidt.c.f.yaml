        - the two specimens figured as Holzschnitt I figs. 1 and 2, from Frau Generalin Plautin, Reval
        - the pieces figured as Holzschnitt II figs. 2 and 3, from the same collection
      occurrences:
      - unit: Echinosphaeritenschicht
        location:
        - Reval
        notes: |
          "Sie sind auf Callopora heterosolen Dyb. (Chaetetes heterosole
          Keys.) aufgewachsen und gehören der jetzt von mir so genannten
          Echinosphaeritenschicht (C₁) an, die die oberste Schicht des
          Estländischen Glints bildet und dem ächten Vaginaten- oder
          Orthocerenkalk (B) aufgelagert ist. Meine Echinosphaeritenschicht
          entspricht grösstentheils dem Schwedischen Chasmopskalk." (p. 1)
          -- "They are grown on Callopora heterosolen Dyb. (Chaetetes
          heterosole Keys.) and belong to the Echinosphaerites bed (C₁),
          which I now so name, which forms the uppermost bed of the
          Estonian Glint and lies on the true Vaginaten- or Orthoceren
          limestone (B). My Echinosphaerites bed corresponds for the most
          part to the Swedish Chasmops limestone."
      notes: |
        Collected in summer 1878 by the family of Major-General S. A.
        Plautin at Reval; the two figured specimens and the pieces of
        Holzschnitt II 2, 3 came from the Generalin Plautin (p. 1). "der zu
        Ehren wir auch unsre Cyathocystis Plautinae benannt haben" (p. 7) --
        "in whose honour we have also named our Cyathocystis Plautinae." No
        specimen number, repository or type word is printed; "Sämmtliche
        Originalstücke gehn noch zu Prof. Lovén nach Stockholm, der sie bei
        seiner grossen Arbeit über Cystideen benutzen wird." (p. 4) -- "All
        the original pieces are still going to Prof. Lovén in Stockholm, who
        will use them in his great work on Cystids."

        The only type wording: "Die runzliche Epitheca ist eben so wie bei
        der typischen Art vorhanden" (p. 7, of C. rhizophora) -- "The
        wrinkled epitheca is present just as in the typical species."
        "Type species" is not printed; `type` here rests on that phrase.
