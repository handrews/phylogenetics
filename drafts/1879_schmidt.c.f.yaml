      - page: 6
        textFigures: [1, 2, 3, 4]
        notes: |
          Holzschnitt III: "Cyathocystis rhizophora von Wassalem. Alles nat.
          Gr. Fig. 1. Ein Zwillingskelch mit deutlicher Epitheca. Fig. 2. Eine
          Kelchbasis oben mit dem Grunde der Höhlung und unten mit breiten
          Wurzelausläufern, bei a Löcher in d. Wand. Fig. 3. Ein gebogener
          Kelch mit seitlichen Verticalfugen und knotigen Wachsthumsansätzen
          auf den Kanten, a wie in vor. Fig. b, Verticalfuge. Fig. 4. Drei
          zusammenhängende Kelche; bei 4 b Seitendurchschnitt, an dem der
          durchgehende Kanal am Grunde sichtbar ist." (p. 6)
      specimens:
