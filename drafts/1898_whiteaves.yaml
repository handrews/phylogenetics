notes: |
  Composed at Ottawa, 14 September 1897 (closing line, p. 396), but not
  actually issued until 7 January 1898: the Number's own wrapper reads
  "[JULY?], 1897" (month OCR-uncertain), while the volume's own issue
  notice for Number 7 reads "ISSUED 7TH JANUARY, 1898" -- independently
  confirmed by Bather 1914 (p. 193), who cites "a 'Postscript' (tom. cit.,
  p. 395, January 7, 1898)".

  The replacement act itself: no word for the act ("nom. subst.",
  "nom. nov.") is printed; it is stated as a request/desire to substitute a
  preoccupied name (see the quoted passage below). The act is recorded
  as `substituted` on the replacing name (the node under it is the name
  replaced), paired with a `synonyms` entry for the replaced one, on the
  pattern of `corrected` for "nom. correct.".

taxonomies:
- taxon: steganoblastus
  new: true
  citedAs: Steganoblastus
  pages: [[395, 396]]
  substituted:
    taxon: astrocystites
  synonyms:
  - taxon: astrocystites
  notes: |
    "In the January number of this journal for the current year the writer
    endeavoured to describe a new genus and species of blastoid-like
    cystideans from the Trenton limestone at Ottawa, under the name
    Astrocystites Canadensis. Since this description was published, the
    writer has been informed by Mr. F. A. Bather, M.A., of the Natural
    History Department of the British Museum, that Haeckel in 1896
    separated Asteroblastus tuberculatus, Schmidt, from the typical A.
    stellatus of Eichwald, under the new generic name Asterocystis. Mr.
    Bather thinks that there is not sufficient difference between the
    words Astrocystites and Astrocystis, and it would obviously be
    inconvenient to use such essentially similar names for two such
    closely related genera. The writer, therefore, desires to be allowed to
    substitute the generic name Steganoblastus (from [Greek, illegible in
    this scan]: Closely covered, with reference to the large covering
    plates and covered mouth, as kindly suggested by Mr. Bather) for that
    of Astrocystites, which is practically preoccupied, and to retain the
    original specific name. In other words it is desired that the genus
    and species in future be called Steganoblastus Canadensis instead of
    Astrocystites Canadensis." (pp. 395-396)

    The objection is grounded in confusability with Asterocystis Haeckel,
    1896 (spelled "Astrocystis" four lines later in the same passage --
    cannot verify which the original type set, and no taxon record for
    either spelling exists in this dataset), not with Asteroblastus
    itself. Whiteaves' own etymology for Steganoblastus is illegible in
    this scan ("oreyavoc"), almost certainly Greek for "covered"
    (στεγανός), as is Bather's 1914 reprint of the same etymology.
  children:
  - taxon: ottawaensis_whiteaves_1897
    citedAs: Steganoblastus Canadensis
    notes: |
      Both sentences above that name the full combination say "Canadensis,"
      not "ottawaensis" -- Whiteaves' own slip, not an OCR artifact: Bather
      1914 (p. 193) independently confirms the printed text and calls it
      Whiteaves' slip, "In this Postscript he inadvertently alluded to the
      species as Steganoblastus canadensis instead of S. ottawaensis." The
      postscript explicitly retains "the original specific name," so
      identity with ottawaensis_whiteaves_1897 is not in doubt.
