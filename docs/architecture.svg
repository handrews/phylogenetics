<svg xmlns="http://www.w3.org/2000/svg" width="680" height="584" viewBox="0 0 680 584" role="img" aria-labelledby="t d">
<title id="t">How phylohist fits together</title>
<desc id="d">Three lanes, human, model and code, read in four columns: the data, the CLI, chat and the eval. The human edits the data and the model optionally reviews it, each reviewing the other's work, while code validates both. The CLI has no model in the lane. In chat the model resolves names and states a plan that the MCP server executes. In the eval the runner drives the model, which also judges the header, while the human writes and reviews the eval. Every surface sits on the same tools over the claim table.</desc>
