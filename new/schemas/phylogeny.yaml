$schema: https://json-schema.org/draft/2020-12/schema
$id: phylogeny

$defs:
  authors:
    type: object
    minProperties: 1
    propertyNames:
      pattern: ^.*$ # ^[^a-z][-a-z]*$
    additionalProperties:
      $ref: "#/$defs/person"
  sources:
    type: object
    properties:
      publications:
        type: object
        minProperties: 1
        propertyNames:
          pattern: ^.*$ # ^[^a-z][-a-z]*$
        additionalProperties:
          $ref: "#/$defs/publication"
      articles:
        type: object
        minProperties: 1
        propertyNames:
          pattern: ^.*$ # ^[^a-z][-a-z]*-[12][7890]\d\d$
        additionalProperties:
          $ref: "#/$defs/article"
  person:
    type: object
    anyOf:
    - required: [family]
    - required: [given]
    properties:
      family:
        type: string
      given:
        type: string
      suffix:
        type: string
      birth:
        $ref: "#/$defs/modularDate"
      death:
        oneOf:
        - $ref: "#/$defs/modularDate"
        - type: "null"
  publication:
    type: object
    required: [name]
    unevaluatedProperties: false
    properties:
      type:
        type: string
        enum:
        - journal
        - book
        default: journal
      name:
        type: string
      publisher:
        type: string
      notes:
        type: string
  article:
    type: object
    required: [authors, title]
    oneOf:
    - required: [journal]
    - required: [book]
    unevaluatedProperties: false
    properties:
      journal:
        type: string
      book:
        type: string
      volume:
        type: [integer, string]
        minimum: 1
      number:
        type: [integer, string]
        minimum: 1
      article:
        type: [integer, string]
        minimum: 1
      pages:
        type: array
        items:
          type: [integer, string]
        minItems: 2
        maxItems: 2
      title:
        type: string
      authors:
        type: array
        minItems: 1
        items:
          type: string
      pubDate:
        $ref: "#/$defs/modularDate"
        unevaluatedProperties: false
      processDates:
        type: object
        additionalProperties: false
        properties:
          submitted:
            $ref: "#/$defs/simpleDate"
          received:
            $ref: "#/$defs/simpleDate"
          revised:
            $ref: "#/$defs/simpleDate"
          accepted:
            $ref: "#/$defs/simpleDate"
          online:
            $ref: "#/$defs/simpleDate"
          issued:
            $ref: "#/$defs/simpleDate"
      identifiers:
        type: object
        additionalProperties: false
        properties:
          url:
            type: string
            format: iri
          doi:
            type: string
          jstor:
            type: integer
            minimum: 1
      quotes:
        type: array
        items:
          type: string
      notes:
        type: string
  tree:
    $id: tree
    $dynamicAnchor: tree
    type: object
    properties:
      taxon:
        type: string
      type:
        type: boolean
        default: false
      new:
        type: boolean
        default: false
      children:
        type: array
        items:
          $dynamicRef: tree
  taxonomy:
    $ref: taxonomyTree
  taxonomyTree:
    $id: taxonomyTree
    $dynamicAnchor: tree
    $ref: tree
    properties:
      specimens:
        type: array
        items:
          $ref: "phylogeny#/$defs/specimen"
    unevaluatedProperties: false
  phylogeny:
    type: object
    properties:
      type:
        type: string  # Enum?  Meh.
      tree:
        $ref: tree
  phylogenyTree:
    $id: phylogenyTree
    $dynamicAnchor: tree
    $ref: tree
    properties:
      data:
        type: object
        additionalProperties:
          type: number
      categories:
        type: array
        items:
          type: string
  specimen:
    type: object
  simpleDate:
    type: string
    pattern: ^\d\d\d\d-\d\d-\d\d$ # ^[12][7890][\d\d]-[01]\d-[0123]\d$
  modularDate:
    type: object
    required: [year]
    properties:
      year:
        type: integer
        minimum: 1700 # Linnaeus was born in 1707
        maximum: 2030
      month:
        type: integer
        minimum: 1
        maximum: 12
      day:
        type: integer
        minimum: 1
    if:
      required: [day]
    then:
      required: [month]
      oneOf:
      - properties:
          month:
            const: 2
          day:
            maximum: 28
      - properties:
          month:
            anyOf:
            - const: 4
            - const: 6
            - const: 9
            - const: 11
          day:
            maximum: 30
      - properties:
          month:
            anyOf:
            - const: 1
            - const: 3
            - const: 5
            - const: 7
            - const: 8
            - const: 10
            - const: 12
          day:
            maximum: 31
