taxonomies:
- taxon: blastozoa
  children:
  - taxon: eocrinoidea
    children:
    - taxon: gogiida-subclass
      notes: |
        "This is not a comprehensive listing of the probable orders to be
        included in this sub class and those listed below and includes only
        those whose representatives were part of this study."
      new: true
      children:
      - taxon: gogiida
        children:
        - taxon: eocrinoidae
          children:
          - taxon: gogia
          - taxon: sinoeocrinus
          - taxon: guizhoueocrinus
          - taxon: globoeocrinus
      - taxon: ascocystitida
        authority:
          source: 2005_frest
        notes: The Frest (2005) in references gives Broadhead (1982)
        children:
        - taxon: rhopalocystitidae
          authority:
            source: 2005_frest
          notes: The Frest (2005) in references does not support this.
          children:
          - taxon: rhopalocystis
        - taxon: cambrocystidae
          notes: |
            Cites Dzik and Orłowski (1993) which actually defines
            Cambrocrinidae, as would be expected for Cambrocrinus.
          children:
          - taxon: cambrocrinus
        - taxon: ascocystitidae
          children:
          - taxon: ascocystites
