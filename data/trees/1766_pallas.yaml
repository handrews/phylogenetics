- notes: >
    Tree for Chapter VIII. APHRODITÆ.
    In this chapter, Pallas refers to Mollsuca (Animalum Molluscorum)
    as a Class despite mostly citing Linnaeus.  It's unclear whether
    he is promoting the taxon so that he can divide it into Orders,
    or if one of his cited sources did the promoting.  He is dismissive
    of Linnaeus's placement of Mollusca within Vers, and of Testacea as
    a distinct order from Mollusca.  When discussing "families" within
    Linnaeus's Mollusca, Pallas seems to be referring to the section
    headings Linnaeus used in his tabular summaries.

    Pallas's Class Mollusca encompasses Linnaeus's Orders Mollusca and Testacea.
  taxon: mollusca
  rank: Class
