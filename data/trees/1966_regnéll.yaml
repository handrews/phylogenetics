      children:
      - taxon: stromatocystitidae
        authority:
          source: 1936_bassler
          notes: Should be 1935_bassler?
        page: U160
        diagnosis: |
          Mouth surrounded and covered by 4 large imperforate plates and
          many small ones; theca flexible, subpentagonal or circular, adoral
          side depressed convex, aboral side slightly concave, enclosing
          a shallow cavity; interambulacral areas and aboral side mostly
          composed of polygonal plates; ambulacra 5, narrow, straight or
          curved, confined to the upper surface; unstalked and unattached. 
        # occurrenceSummary:
        # - seriesRange: [Lower Cambrian, Upper Devonian]
        children:
