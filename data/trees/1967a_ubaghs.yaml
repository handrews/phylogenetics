  editorial:
    inferred: [authority]
    basis: >
      The taxon is never formally declared despite being the subject of this
      and the following two volumes.  There closest to an attribution is:
      'It was not until 1789, however, that BRUGUIERE established the order
      of the "Vers echinodermes"'.
