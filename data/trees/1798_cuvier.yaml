notes: |
  This text is very hard to map to Linnaean taxonomies, with various
  groupings of an unclear nature, some grouping some species of one
  genus with another and other confusing arrangements.
taxonomies:
- taxon: animalia
  notes: des animaux
  children:
  - taxon: mammalia
    notes: des mammifères
  - taxon: aves
    notes: des oiseaux
  - taxon: amphibia_linnaeus_1758
    notes: des reptiles, explicitly synnonomized with Linnaeus's Amphibia
  - taxon: pisces
    notes: des poissons
  - taxon: mollusca-class
    notes: des mollusques
  - taxon: insecta
    notes: des insectes
  - taxon: vers
    notes: vermes
    children:
    - notes: |
        VERS pourvus d’épines ou de soies pour s’aider dans leurs mouvemens.
        (Worms equipped with spines or bristles to assist them in their
