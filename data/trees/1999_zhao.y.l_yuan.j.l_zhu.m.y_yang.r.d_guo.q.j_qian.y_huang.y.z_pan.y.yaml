- taxon: pararotadiscus_zhu.m.y_erdtmann_zhao.y.l_1999
  nudum: true
  pages: 4
  editorial:
    inferred: [nudum]
    basis: >
      The citation is an abstract with no formal description, and no such
      description is given here either.
      Pararotadiscus is properly credited to Zhu, Zhao, & Chen (2002).
  notes: >
    Classified as "medusiform animals" in the English section.  The
    Chinese section references a prior assignment to or near what
    seems to be Lophophorata based on the included phyla (Bryozoa,
    Brachiopoda, Phoronida, and Entoprocta), but does not appear
    to defnitively endorse a position.
  children:
  - taxon: taijiangensis_zhao.y.l_zhu.m.y_1994
    nudum: true
    pages: 13
    editorial:
      inferred: [nudum]
      basis: >
        Apparently intended to reference
        Rotadiscus guizhouensis Zhao & Zhu 1994,
        which in 2002 was validly recombined as Pararotadiscus guizhouensis.
        Since it appears to be a distinct name but without description,
        it is considered a nomen nudum rather than a lapsus calami in modern
        taxonomy (contrast with Steganoblastus canadensis).
    illustrations:
    - plate: III
      figures: 1
      of: 112
    - plate: III
      figures: 6
      of: 113
    material:
    - prefix: GK
      numbers: [112]
      asPrinted: GTBM-20-33, GK112
      context: miaobanpo-20-33
    - prefix: GK
      numbers: [113]
      asPrinted: GTBM-24-3-633, GK113。
      context: miaobanpo-24-3-633
