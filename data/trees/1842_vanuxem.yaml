taxonomies:
- notes: |
    No formal systematics, only echinoderm taxa included as best as could
    be found by searching/skimming the taxt; could not find species
    authority info for possible species Pentacrinites hamptonii,
    Encrinites lævis, or E. triciclas; Echinus drydenensis was tentatively
    proposed but seems to have been a nomen nudum.
  taxon: crinoidea-family
  children:
  - taxon: agelacrinites
    new: true
    rank: genus
    pages: 158
    children:
    - taxon: hamiltonensis_vanuxem_1842
      new: true
      diagnosis: |
        A cast of it shows a connected surface, upon which six detached
        circular forms were placed, having the appearance of medallions;
        their whole surface, and sides which are inclined, being highly
        wrought with minute markings like gothic tracery.... Near the centre
        of the largest and perfect medallion are five branching arms, like
        those of an asteria or star-fish; between two of which, and those
        which are most expanded, is a star, which probably was the mouth
        of the animal.
      pages: 158
      illustrations:
      - page: 306
        figures:
        - 80
      occurrences:
      - unit:
        - Hamilton group
        - New York System
        location:
        - upper quarry
        - the hill back of the Seminary
        - West-Hamilton village
        - Madison County
        - New York
        - United States
          upper quarry
        specimens:
          "":
            holotypes:
            - "Page 306, Figure 80"
        notes: |
          Six organisms on the slab, but only one complete.  Three
          full-size, including the complete fossil, two small, and
          one in between.  The small are in the angle between two
          of the large, with the mid-sized adjacent to one large and
          the third large ont he other side of the first two.
