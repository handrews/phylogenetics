- treeType: cladogram
  tree:
    taxon: agelacrinitinae
    children:
    - taxon: isorophusella
    - children:
      - children:
        - taxon: isorophus
        - taxon: hemicystis
        - children:
          - taxon: curvitriordo
          - taxon: rectitriordo
      - children:
        - taxon: agelacrinites
        - children:
          - taxon: krama
          - children:
            - taxon: postibulla
            - children:
              - children:
                - taxon: discocystis
                - taxon: lispidecodus
              - children:
                - taxon: stalticodiscus
                - children:
                  - taxon: lepidodiscus
                  - taxon: ulrichidiscus
- treeType: diagram
  notes: evolutionary timeline
  tree:
    taxon: isorophusella
    children:
    - children:
      - taxon: rectitriordo
      - taxon: curvitriordo
    - taxon: isorophus
      children:
      - taxon: hemicystites
        children:
        - taxon: agelacrinites
          children:
          - taxon: krama
            children:
            - taxon: postibulla
            - notes: |
                The genus 'Lepidodiscus' ephraemovianus (Bogolubov) is too
