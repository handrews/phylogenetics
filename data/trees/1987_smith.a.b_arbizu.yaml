taxonomies:
- taxon: isorophida
  children:
  - taxon: agelacrinitidae
    children:
    - taxon: agelacrinitinae
      synonyms:
      - taxon: isorophinae
        notes: |
          Smith in this paper notes that his previous use
          of Isorophinae disregarded the naming rules based on the
          inclusion of Agelacrinites, the type genus of the parent
          family Agelacrinitidae.
      children:
      - taxon: krama
        children:
        - taxon: devonica_bassler_1936
