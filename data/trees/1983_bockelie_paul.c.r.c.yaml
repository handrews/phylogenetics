taxonomies:
- taxon: edrioasteroidea
  children:
  - taxon: cyathocystida
    emended: true
    citedAs: Order Cyathocystida (Bell 1975)
    modifier: nomen transl.
    notes: nom. transl. from suborder cyathocystina
    diagnosis: >
      Edrioasteroids with a directly attached cup-shaped or tubular theca
      composed of a single plate and forming a com-
      plete aboral cover; with five primary oral cover
      plates that remain in contact with each other
      over the mouth throughout growth; with basical-
      ly simple biserial, imperforate ambulacral cover
      plates, but without ambulacral flooring plates;
      with one large deltoid plate in each inter-radius
      fused to the ambulacral cover plates.
    children:
    - taxon: cyathocystidae
      emended: true
      diagnosis: As for Order Cyathocystida.
      children:
      - taxon: cyathocystis
        diagnosis: >
          Cyathocystids with an oral surface
          which includes a peripheral circlet of small plates
          adjacent to the thecal margin; with an anal cover
          of 1 or 2 circlets of plates.
        children:
        - taxon: plautinae_schmidt_1879
          type: true
          notes: Type species by monotypy.
      - taxon: cyathotheca
        diagnosis: >
          Cyathocystids with an oral surface
          which lacks a peripheral series of plates adjacent
          to the thecal margin, but with two adanal plates
          in the posterior inter-radii; with a simple anal
          pyramid.
        children:
        - taxon: suecica_jaekel_1927
          type: true
          notes: Type species by original description.
      removed:
      - taxon: timeischytes
        authority:
          source: 1980_bell.b.m
        notes: >
          The affinities of the Devonian genera are
          more difficult to settle, but we suspect they represent specialized,
          probably neotenous, offshoots from the Agelacrinitidae.
          We are uncertain whether to assign them to that family or to a
          family (or families) of their own.
      - taxon: hadrochthus
        provisional: true
        authority:
          source: 1980_bell.b.m
        notes: >
          The affinities of the Devonian genera are
          more difficult to settle, but we suspect they represent specialized,
          probably neotenous, offshoots from the Agelacrinitidae.
          We are uncertain whether to assign them to that family or to a
          family (or families) of their own.
phylogenies:
