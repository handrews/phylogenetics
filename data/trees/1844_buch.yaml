  - taxon: sphaeronites
    citedAs: SPHAERONITES
    isType: true
    pages: 126
    notes: >
      Die Sphaeroniten können als das Symbol oder als der Typus aller
      Cystideen angesehen werden; denn sie entfernen sich am weitesten
      von Allem, was an Crinoideen erinnern könnte; und die kugelrunde
      Form läfst eher auf eine Entwickelung schliefsen vom Mittelpunkt
      fast gleichförmig nach allen Seiten hin, als auf eine in einer
      bestimmten Richtung nach Oben hinauf, wie bei den Crinoideen.

      Via Google Translate:

      Sphaeronites can be regarded as the symbol or the archetype
      of all cystoids; for they depart most significantly from anything
      that might recall the crinoids, and their spherical form suggests
      a development that proceeds almost uniformly from the center in all
      directions, rather than one directed upward along a specific axis,
      as is the case with the crinoids.
