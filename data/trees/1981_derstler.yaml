phylogenies:
- treeType: other
  notes: >
    The text layes out a very speculative organization of early higher taxa,
    grouping three in a proposed unnamed clade and treating the others as
    all indpendent of each other rather than grouped.  To the best of my
    knowledge, this idea was not developed further.
  tree:
    taxon: echinodermata
    children:
    - notes: early cambrian
      children:
      - taxon: edrioasteroidea
      - taxon: helicoplacoidea
      - taxon: blastozoa
    - notes: early cambrian
      taxon: soluta
    - notes: middle cambrian
      taxon: cincta
    - notes: middle cambrian
      taxon: ctenocystoidea
    - notes: middle cambrian
      taxon: stylophora
    - notes: >
        middle cambrian
        Placed here "if they are not related to the edrioasteroids", but it
        is not clear if the alternate placement would be within or beside them.
      taxon: cyclocystoidea
      provisional: true
    - notes: middle cambrian or upper cambrian
      taxon: crinoidea
    - notes: ordovician
      taxon: asterozoa
    - notes: ordovician
      taxon: echinozoa
