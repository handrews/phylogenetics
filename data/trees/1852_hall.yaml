          synonyms:
          - taxon: plumosus_hall_1843
            provisional: true
            parents:
            - taxon: actinocrinus
        - openTaxon: glyptocrinus-sp_hall_1852
          notes: Clinton Group
      - taxon: ichthyocrinus
        children:
        - taxon: clintonensis_hall_1852
          provisional: true
          new: true
          notes: Clinton Group
