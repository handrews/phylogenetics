notes: >
  Hall calls nearly everything a "family", and only mentions orders in
  the context of von Buch's definition of Cystidea as "forming a distinct
  order of Echinoderms, inferior to the Crinoids." (p. 233).

  Note that some fossils may appear in more places than their chapter
  position implies.
taxonomies:
- taxon: echinodermata
  rank: null
  children:
  - taxon: crinoidea
    rank: Order
    sensu: lato
    editorial:
      inferred: [rank, sensu]
      basis: >
        Hall only mentions orders on page 233, noting von Buch's definition
        of Cystidea as "forming a distinct order of Echinoderms, inferior
        to the Crinoids."  But he also distinguishes between crinoids in
        general and "true crinoids", although he also mentions the
        "true Cystidea" on page 178 in the context of Caryocrinus, which
        he appears to place outside of both "true" restricted families.
    synonyms:
    - taxon: crinoideae
      notes: Alternate spelling used in text.
    children:
    - taxon: caryocrinus
      notes: >
        These characters show more clearly how near is the Caryocrinus
        to Cystideans, and suggests whether it should not be included
        in this family. (p. 225)
      children:
      - taxon: ornatus_say_1825
        notes: Clinton Group
    - taxon: crinoidea
      rank: Family
      sensu: stricto
      editorial:
        inferred: [rank, sensu]
        basis: >
          Hall mostly calls everything a Family, but definitely makes
          distinctions between crinoids and "true crinoids".
      children:
      - taxon: closterocrinus
        new: true
        children:
        - taxon: elongatus_hall_1852
          new: true
          notes: Clinton Group
      - taxon: glyptocrinus
