taxonomies:
- notes: >
    Traditional classification (based on Bell 1980, but with later additions)
  taxon: edrioasteroidea
  rank: Class
  editorial:
    inferred: true
    basis: >
      Table heading is "Classification of the Edrioasteroidea."
      This is the "traditional" classification column, and page 733
      notes "Edrioasteroids have... since 1899, been assigned the
      status of class (Bather 1899)."  The typical authority of
      Billings, 1858 is used in the other column of the table.
  children:
  - taxon: stromatocystitida
    notes: |
      Termier and Termier 1969 instead of Bell 1980, but AFAICT without
      seeing the full paper, it did not erect the formal latin taxon.
    children:
    - taxon: stromatocystitidae
    - taxon: cambrasteridae
  - taxon: edrioasterida
    citedAs: Order EDRIOASTEROIDA Bell, 1976
    lapsus:
      taxon: edrioasteroida
    notes: Correctly spelled Edrioasterida in the other column.
    children:
    - taxon: edrioasteridae
    - taxon: totiglobidae
  - taxon: isorophida
    children:
    - taxon: lebetodiscina
      children:
      - taxon: lebetodiscidae
      - taxon: carneyellidae
    - taxon: isorophina
      children:
      - taxon: hemicystitidae
        synonyms:
        - taxon: isorophidae
      - taxon: agelacrinitidae
    - openTaxon: isorophida-uncertain-suborder_bell.b.m_1976
      children:
      - taxon: pyrgocystidae
      - taxon: lispidecodidae
      - taxon: rhenocystidae
  - taxon: cyathocystida
    notes: |
      Credits Bockelie and Paul (1983), but they credit Bell based on
      establishment of suborder Cyathocystina, which they translated
      to an order.
    children:
    - taxon: cyathocystidae
- notes: >
    Revised classification (A. B. Smith 1985)
    This is the 2nd column of the table.
  children:
  - taxon: stromatocystites
  - taxon: edrioasteroidea
    citedAs: Plesion (Class) EDRIOASTEROIDEA Billings, 1858
    rank: Plesion
    mutable: true
    pages: 734
    children:
    - taxon: edrioasterida
      citedAs: Order EDRIOASTERIDA Bell, 1976 (sedis mutabilis)
      rank: Order
      children:
      - taxon: totiglobidae
      - taxon: edrioasteridae
        citedAs: Family EDRIOASTERIDAE Bather, 1898
        authority:
          source: 1898_bather
    - taxon: isorophida
      emended: true
      mutable: true
      children:
      - taxon: cambraster
      - taxon: edriodiscus
      - taxon: cyclocystoididae
      - taxon: agelacrinitidae
        children:
        - taxon: isorophinae
          translated:
            taxon: isorophina
        - taxon: lebetodiscinae
          translated:
            taxon: lebetodiscina
    - taxon: cyathocystida
      emended: true
      mutable: true
      children:
      - taxon: pyrgocystidae
      - taxon: cyathocystidae
- notes: Systematic paleontology, no higher taxa given.
  children:
  - taxon: stromatocystites
    children:
    - taxon: pentangularis_pompeckj_1896
      isType: true
    - taxon: walcotti_schuchert_1919
    - taxon: balticus_jaekel_1899
      notes: Recommend treating as nomen dubium due to lost specimens.
  - taxon: walcottidiscus
    children:
    - taxon: typicalis_bassler_1935
      isType: true
      synonyms:
      - taxon: magister_bassler_1936
  - taxon: totiglobus
