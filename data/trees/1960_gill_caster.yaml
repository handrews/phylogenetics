            pages: 11
            editorial:
              corrections:
                auth: null
                year: null
                authority:
                  source: 1918_jaekel
              basis: >
                There's no clear evidence that this was meant to indicate as
                emended in 1921, as Carpoidea and Soluta explicitly note this.
                Jaekel definitely established Mitrata in 1918.
            children:
            - taxon: placocystida
