    non:
      authority:
        source: bruguière_1789a
    pages: 31
    editorial:
      inferred: [sensu, emended, non]
      basis: >
        Leuckart explicitly notes Cuvier as the first to recognize
        the interrelationships of the Echinodermata, and contrasts
        Cuvier's definition with the less comprehsensive definition first
        established as an Order by Bruguière in the Encyclopédie Méthodique.

        Leuckart also notes Cuvier treating Echinodermata as a Class,
        which he first did in Cuvier 1817d (after previously treating
        it as an Order in Cuvier 1798), which is also where he first
        included the Crinoidea (as the genus Encrinus), which Leuckart
        addresses here, so Cuvier 1817d seems like the most accurate
        citation.  Leuckart does not reference a specific workl
