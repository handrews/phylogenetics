taxonomies:
- taxon: animalia
  rank: Kingdom
  removed:
    taxon: infusoria
  pages: 10
  editorial:
    inferred: true
    basis: >
      Based on our current understanding... the divisions of
      Coelenterata, Echinodermata, Vermes, Arthropoda, Mollusca, and Vertebrata
      appear to represent the various fundamental types of the animal kingdom
      created by nature.

      We leave the infusoria out of consideration here. Despite the classic
      studies by Ehrenberg, our knowledge of them remains too limited to
      justify forming a reasonably well-founded judgment about them.
      However, it seems highly probable to me that the entire division
      of these enigmatic creatures — at least as a distinct, cohesive group —
      will eventually be removed from the zoological classification system.
      (via Google Translate).
  children:
