    inferred: [rank]
    basis: >
      Zoophyta is listed in the "Class or Order" column of the table
      on page 330, and Class seems more likely for this very high-level taxon.
      Discophyllum appears in the "Corals of the Hudson River Group" chapter,
      and other taxa from that chapter are also grouped in Zoophyta without
      subdivision in the charts on pages 322–329, so the ordinal level appears
      to be absent for Zoophyta.
