          - [185, 192]
          illustrations:
          - plate: 2
            figures:
            - [1, 5]
        - taxon: echino-encrinites
          auth: [von Meyer]
          in: [Karstner]
          year: 1826
          notes: volume iii
          pages:
          - [232, 237]
        - taxon: echinosphærites
          auth: [Pander]
          year: 1830
          notes: '"Sp."'
        - taxon: echinosphærites
          auth: [Bronn]
          year: 1835
          notes: '"Sp."'
        - taxon: goniocrinites
          auth: [Eichwald]
          year: 1840
        - taxon: echino-encrinus
          auth: [Volborth]
