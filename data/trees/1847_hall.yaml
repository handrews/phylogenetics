notes: >
  Hall is maddeningly unclear regarding higher echinoderm taxa.
  On page 80:

    "In addition to the CRINOIDEA of this ancient period, we have,
    in the Family ECHINODERMATA, the Genus ASTERIAS,"

  which seems to indicate that Echinodermata and Crinoidea are
  sibling taxa, with Asterias under Echinodermata.  On page 87:

    "Von Buch has included in his family CYSTIDEA, a group
    intermediate between the ECHINIDEA and the true CRINOIDEA, ...
    the peculiar forms of ECHINODERMATA, the CRINOIDEA,
    flourished in considerable numbers, a genus also existed which
    indicated a structure intermediate between that then numerous family,
    and the future ECHINIDEA, a portion of this great group being at
    the same geological period represented by a true ASTERIAS."

  which seems to indicate that Crinoidea is within Echinodermata,
  but also seems to make a distinction between Crinoidea as a whole
  and "true Crinoidea".  It also does not dispute (but does not clearly
  endorse Cystidea as a Family, and describes Crinoidea as a Family
  as well, probably meaning "true Crinoidea" but again this is not
  entirely clear to the modern reader.  In this sense, at least, Echinidea,
  which is not given a rank although Family seems reasonable, is distinct
  from the Family Crinoidea.  What "a true Asterias" means and why it
  is only addressed as a Genus and not otherwise classified is also unclear.

  In the summary table on page 323, all genera described in the book are
  listed under the heading "Crinoidea", including the genus Asterias.
  In the alternative table on page 330, "Crinoidea" appears in the column
  labeled "CLASS or ORDER".

  Because the actual declarations are organized by formation and locality,
  the table on page 323 is used to organize the tree.  Echinodermata and
  Echinidea are omitted due ot lack of clarity, and Crinoidea is given
  as both an Order (sensu lato), on the grounds that that seems more viable
  than Class, and as a Family (sensu stricto) for the "true Crinoidea".

  This may or may not resemble Hall's intentions.

  Note also that Tentaculites (Emmons 1842) flexuosa n. sp. is placed
  in chapters on Crinoids or on both Corals and Crinoids, and is said
  to be "more nearly with Crinoideans than with Corals", but is placed
  under Zoophyta with undisputed corals in the summary tables and so
  is omitted here.
taxonomies:
- taxon: crinoidea
  rank: Order
  sensu: lato
  pages: 15, 80, 278, 323, 330
  editorial:
    inferred: [rank, sensu]
    basis: >
      In the summary table on page 330, Crinoidea appears in the
      "Class or Order" column, and all crinoid, cystoid, or asteroid
      genera are included under the Crinoidea heading in the table
      on page 323.  Order seems reasonable if Echinodermata is indeed
      considered the parent of Crinoidea sensu lato, as Echinodermata
      would be the Class since the concept of Phylum was not yet
      well-developed.
  children:
  - taxon: crinoidea
    citedAs: the true Crinoidea
    rank: Family
    sensu: stricto
    pages: 87
    editorial:
      inferred: [rank, sensu]
      basis: >
        Crinoidea is referred to as a Family at least once, and there
        is definitely a distinction between Crinoidea in general and
        "the true Crinoidea", which is interpreted here as a sensu
        lato vs stricto.
