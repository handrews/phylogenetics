- taxon: echinodermata-class
  notes: |
    Trenton limestone
    Echinodermata described as a family in text, but also as containing
    the families Crinoidea, Cystidea, Echinidea and the genus Asterias,
    although Crinoidea is also described as an "Order or Class" in a table,
    and even Asterias is included there..
  children:
  - taxon: crinoidea-order
    children:
    - taxon: asterias
      notes: |
        No mention of Asteriadea, or its ordered relationship to the
        Crinoidea -> Cystidea -> Echinidea sequence, but phrases like
        "approaching a true Asterias" suggest it is veiwed as higher?
      children:
      - taxon: matunita_hall_1847
        new: true
    - taxon: crinoidea-family
      notes: Seems to use Crinoidea as both Order and Family?
      children:
      - taxon: schizocrinus
        new: true
        children:
        - taxon: nodosus_hall_1847
          new: true
      - taxon: poteriocrinus
        children:
        - taxon: alternatus_hall_1847
          new: true
        - taxon: gracilis_hall_1847_poteriocrinus
          new: true
      - taxon: scyphocrinus
        new: true
        children:
        - taxon: heterocostalis_hall_1847
          new: true
    - taxon: cystidea-family
      notes: |
        Mostly described as a separate family from Crinoidea, noting it
        as intermediate between them and the Echinidea, but sometimes
        spoken of compared to "true Crinoidea" implying containment?
        Seems to use Crinoidea as both Order and Family?
      children:
      - taxon: echino-encrinites
        synonyms:
        - taxon: echino-encrinites
          auth: [von Meyer]
          in: [Karstner]
          year: 1826
          notes: volume ii; specimen has since been lost
