taxonomies:
- taxon: echinodermata
  children:
  - taxon: edrioasteroidea
    children:
    - taxon: edrioasterida
      children:
      - taxon: edrioblastoidina
        children:
        - taxon: rhenopyrgidae
          pages: 118
          diagnosis: |
            Pyrgate edrioasteroids with relatively
            small oral surfaces bearing ve, short, straight rapidly tapering
            ambulacra; interambulacra formed of single tessellate
            interradial oral plates and biserial and alternating oor plates
            that may or may not be fused; cover plates, where present, are
            biserial and tall proximally; sub oral constriction generally
            short, composed of circlets of poorly organized imbricate,
            scale-like plates and periproct, sometimes withdrawn behind
            collar plates; collar plates large, forming a single imbricate
            circlet at base of suboral constriction; pyrgate zone comprised
            of highly imbricated scale-like plates often in eight rows
            arranged in alternating circlets of four; holdfast formed of
            coriaceous sac comprised of small unorganized platelets.
          emended: true
#           occurrenceSummary:
