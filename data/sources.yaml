2010_müller.p_hahn:
  title: Edrioasteroidea aus den Seifen-Schichten im Westerwald, Rheinisches Schiefer-Gebirge (Unter-Devon, Deutschland), Teil 1
  journal: geo-et-palaeo
  volume: 43
  pubDate:
    year: 2010
    month: 3
    day: 30
  pages:
  - 9
  - 47
  authors:
  - müller.p
  - hahn
  quotes:
  - |
    Bell (1976) established the order Isorophida with
    the two suborders Lebedocystina and Isorophina.
    The Isorophina are further subdivided into
    Isorophidae (Bell, 1976) [correct name Hemicystidae,
    provided the genus Hemicystitides (Hall, 1852) is included
    in this family) for the original, Ordovician-Silurian
    genera, and Agelacrinitidae (Chapman, 1860) for
    the advanced Devonian-Carboniferous genera.
    The Pyrgocystidae (Kesling, 1967) with the genus
    Pergocystis (Bather, 1915) and the Carboniferous
    Lispidecodidae (Kesling, 1967) with
    Lispidecodus (Kesling, 1967) are not mentioned in Bell.
  - |
    Holloway and Jell (1983) established the Rhenopyrgidae
    with the genus Rhenopyrgus (Dehm, 1961). They left the
    assignment of this family to an order open.
  - |
    Smith and Arbizu (1987) combine all taxa of the Isorophina
    into the subfamily Agelacrinitinae and present their phylogeny.
  - |
    Sumrall (1993) again uses the families Isorophidae and
    Agelacrinitidae in the sense of Bell.
  - |
    Sumrall, Garbisch and Pope (2000) establish the subfamily
    Postibullinae within the Agelacrinitidae
  - |
    Guensburg and Sprinkle (1994) subdivide the Isorophida
    into only two families without subdivision into
    suborders — Agelacrinitidae (incl. the Hemicystitidae)
    and the Lebetodiscidae (incl. the Pyrgocystidae).
  - |
    Here, we follow the classification by
    Guensburg & Sprinkle (1994), but classify the Hemicystitidae
    and the Pyrgocystidae as independent families. This now
    provides three families and three subfamilies for the
    Devonian-Carboniferous forms — the Agelacrinitidae
    (with the Agelacrinitinae, Discocystinae, and Postibullinae),
    the Pyrgocystidae, and the Rhenopyrgidae. With the exception
    of the Discocystinae (only documented from the Upper Devonian
    onward), all of these families and subfamilies occur in the
    German Lower Devonian; however, the Rhenopyrgidae are not
    discussed in this study. The systematic classification of
    the Agelacrinitidae is essentially based on Sumrall (1996, 2000).
  - |
    Pyrgocystidae
    In the past, about a dozen taxa have been described under
    Pyrgocystis, of which only the scale tube is present
    (Bather 1915; Richter 1930; Hecker 1939; Regnéll 1945).
    According to Holloway & Jell (1983), only forms whose
    penduncular zone is not composed of vertically arranged
    rows of plates belong to Pyrgocystis, so they only include
    the type species P. sardesoni (Bather, 1915), and, with
    reservations, P. volborthi (Hecker, 1939) and P.? petalus
    (Holloway & Jell, 1938) from the Ludlovian of Australia.
    Klug et al. (2008) also classify Rhenopyrgus octogona
    (Richter, 1930) as Pyrgocystis. Since the scale tube of
    this species consists of vertical keeled rows, we consider
    an assignment to Pyrgocystis unlikely.
    According to Holloway & Jell (1983), the Ordovician type
    species is based on only one specimen (see Regnéll 1966,
    Fig. 127-2a-b), which only poorly reveals the structure
    of the adoral region. Therefore, the assignment of
    P.? petalus to this genus is uncertain, which
    Holloway & Jell (1983) express by adding a question mark
    to P.? petalus. We follow this example here with
    P.? postpetalus n. sp. from the Lower Devonian of Germany.
  - |
    On the position of P. neglecta — Smith, 1983, places
    the species within Postibulla; this assignment is adopted
    by Sumrall et al. (2000). However, the genus differs from
    Postibulla in one essential characteristic—a posterior
    oral protrusion is not developed, which is why it is
    placed here within Parapostibulla.
  - |
    The key difference between Agelacrinites and Krama lies
    in the structure of the ambulacra. While these are
    biserial in Agelacrinites, they are triserial to multiserial
    in Krama. The genus was established by Bell (1965) as
    a monotypic genus with the species K. devonica (Bassler, 1936)
    based on material from the Middle Devonian of North America.
    Smith & Arbizui (1987) described a specimen from the
    Lower Devonian of Spain, which they placed under
    Krama devonica. According to current knowledge, this is
    a representative of a separate species (K. hispanica n. sp.).
    In addition, two new species from the Lower Devonian of
    Germany were described. The main differences between these
    four species relate to the structure of the oral region,
    the course of the ambulacrum D, the thecal type, the
    number of plate rows between the ambulacrum C and the
    periprocete, the structure of the upper ring, and the
    appearance of sculpture in the form of a granulated plate
    surface. Table 4 summarizes the differences between the
    four species.
