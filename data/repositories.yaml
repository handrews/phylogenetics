# Every prefix a catalog number in the trees may carry, keyed by the form
# the registry prefers. `formerly` lists other printed forms that mean the
# same holder; a catalog number's prefix resolves against keys and aliases,
# and a source whose abbreviations differ carries `repositoryAbbreviations`
# on its record, which wins within that source. An entry marked
# "unconfirmed" in `notes` has a name the corpus does not state; confirm it
# against the paper before relying on it.
AMNH:
  name: American Museum of Natural History
  kind: institution
  place: New York
ANU:
  name: Australian National University
  kind: institution
  place: Canberra
  notes: Defined in Jell, Burrett & Banks 1985 (p. 184).
