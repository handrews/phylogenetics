# Every holder a catalog number in the trees may name, organised by holder:
# an institution, a collection inside one (`within`), or a person. `subject`
# says what an entry's numbers identify. `prefixes` lists the printed
# prefixes that resolve to the entry and `formerly` its earlier names, which
# resolve too; a collection may print its parent's prefix and list none of
# its own. When two entries claim the same prefix, a tree file whose numbers
# use it lists the entry it means under its own `repositories`. An entry
# marked "unconfirmed" in `notes` has a name the corpus does not state.
