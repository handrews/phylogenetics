            illustrations:
            - plate: XXIX
              figures:
              - 3a
        - taxon: granatum_wahlenberg_1821
      - taxon: pomum_gyllenhaal_1772
        illustrations:
        - plate: I
          figures:
          - [15, 16]
        synonyms:
        - authority:
            source: 1772_gyllenhaal
          parents:
          - taxon: echinus
    - taxon: hemicosmites
      new: true
      pages:
      - [32, 33]
      children:
      - taxon: pyriformis_buch_1840
        new: true
        pages:
        - [32, 33]
        illustrations:
        - plate: I
          figures:
          - [1, 3]
          - [6, 7]
          - 11
          - 13
        notes: |
          One statement references figure 16, but clearly means 13 as it
          reference the exploded plate analysis of that figure.
          Pander's E. malum is not explicitly synonymized with H. pyriformis,
          nor is it explicitly recombined as H. malum (its modern name).
          However, the plates for E. malum are discussed as Hemicosmites
          plates, so it is included as a synonym.
