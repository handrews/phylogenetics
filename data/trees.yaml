2005_frest:
  taxonomies:
  - taxon: blastozoa
    children:
    - taxon: eocrinoidea
      notes: nom. transl. Regnéll, 1945 ex Subclass Eocrinoidea Jaekel, 1918
      diagnosis: |
        Theca of adjacent or imbricate plates, with or without transsutural
        epispires; subvective appendages generally erect, often biserial
        brachioles (arranged in two to five groups) confined to adoral end of
        theca, arising from generally distinct oral surface (tegmen) bearing
        central mouth; theca globular or flattened, often composed of numerous,
        irregularly arranged plates; attachment appendage either an irregularly
        plated holdfast or a true stem. (Modified from Sprinkle 1973, p. 58;
        Ubaghs 1978b, p. T362; Broadhead 1980, p. 125; for an alternative
        view, see Broadhead 1982.)
      children:
      - taxon: ampheristocystidae
        diagnosis: |
          Eocrinoids with definite regular tegmen consisting of orals and fixed
          ambulacrals; theca fusiform; the- cal plates moderate in number,
          fairly regularly arranged in a few, mostly closed circlets; five
          ambulacra terminating as single facets on oral–oral sutures, bearing
          biserial trunk with brachioles. Stem, when present, crinoid-like.
        new: true
        children:
        - taxon: ampheristocystis
          diagnosis: |
            Theca fusiform; tegmen composed of six large orals and five large
            suborals, plus a central and a few smaller ambulacrals; periproct
            terminal on tube-like projection; hydropore on suboral–oral suture
            in CD interray; no visible gonopore; well developed stem on some
            specimens.
          new: true
          synonyms:
          - taxon: ampheristocystis
            modifier: nomen nudum
            citation:
              authors:
              - frest
              year: 1984
              source: |
                Studies of Silurian echinoderms. Dissertation Abstracts
                International B44
              content: 2097
          - taxon: ampheristocystis
            modifier: nomen nudum
            citation:
              authors:
              - frest
              - brett
              - witzke
              year: 1999
              source: |
                "Caradocian-Gedinnian echinoderm associations of central and
                eastern North America. In Paleocommunity Analysis: A
                Silurian-Lower Devonian Example, Boucot AJ, Lawson JD (eds).
                Cambridge University Press: Cambridge; 638–783."
              content: pp. 728, 729
          children:
          - taxon: concentricus_frest_2005
            diagnosis: |
              Aboral thecal plates ornamented by raised concentric ridges;
              tegminals nodose; small, elongate fusi- form theca constricted
              slightly below tegmen; five or six thecal plate circlets,
              adorally interrupted and aborally complete; large stem facet
              (or base), about one-third maximum thecal diameter.
            new: true
            synonyms:
            - taxon: concentricus_frest_2005
              modifier: nomen nudum
              citation:
                year: 1999
                source: |
                  "Caradocian-Gedinnian echinoderm associations of central and
                  eastern North America. In Paleocommunity Analysis: A
                  Silurian-Lower Devonian Example, Boucot AJ, Lawson JD (eds).
                  Cambridge University Press: Cambridge; 638–783."
                content: pp. 729
              notes: Also cites Frest & Strimple, but unclear what paper.
2006_parsley_zhao.y.l:
  taxonomies:
  - taxon: blastozoa
    children:
    - taxon: eocrinoidea
      children:
      - taxon: gogiida
        emended: true
        diagnosis: |
          Emended from Sprinkle, 1973. Eocrinoids with at tachment disk and
          stalklike structure ranging from poorly organized holdfast to column
          with essentially holomeric elements, transverse ambulacral system
          on the upper face of theca (probably with 2-1-2 branching in mature
          specimens), and loosely organized theca (regular series of plates are
          present in adult Sinoeocrinus with almost all plates having
          well-developed sutural pores. Brachioles of typical construction;
          straight or variously twisted or coiled, and commonly have tall
          covering plates over food grooves.
        synonyms:
        - openTaxon: eocrinoidea-unnamed-order-1_sprinkle_1973
        children:
        - taxon: eocrinidae
          emended: true
          diagnosis: |
            Calyx plates numerous, commonly irregularly arranged, but in very
            small juveniles at least three or more well-defined series are
            developed under ambulacrum; thecal plates  have epispires that
            morphologically vary considerably in ontogeny. Ambulacral system
            confined to upper (or oral) thecal surface, consisting of three
            to five simple ambulacral grooves leading to exothecal brachioles.
            Brachioles may be straight, twisted, or coiled. Holdfast, variable
            in length, irregularly multiplated with distal flattened,
            multiplated attachment disk. Lower to Middle Cambrian (modified
            from Sprinkle, 1973).
          synonyms:
          - taxon: sinoeocrinidae
            pars: true
          - taxon: lichenoididae
            notes: "=Lichenoididae Jaekel, 1918, Zhao et al., 1994 (pars)"
            pars: true
          children:
          - taxon: gogia
          - taxon: acanthocystites
          - taxon: akadocrinus
          - taxon: sinoeocrinus
            synonyms:
            - taxon: paragogia
            - taxon: curteocrinus
            children:
            - taxon: lui_zhao.y.l_huang.y.z_gong.x.y_1994
              type: true
              notes: Page numbers from English translation, which is 2nd half of paper
              synonyms:
              - taxon: curtobrachiolus_zhao.y.l_huang.y.z_gong.x.y_1994
              - taxon: lepidus_zhao.y.l_huang.y.z_gong.x.y_1994
              - taxon: longus_zhao.y.l_huang.y.z_gong.x.y_1994
              - taxon: minus_zhao.y.l_huang.y.z_gong.x.y_1994
              - taxon: globosa_zhao.y.l_huang.y.z_gong.x.y_1994
                parents:
                - taxon: paragogia
              - taxon: guizhouensis_zhao.y.l_huang.y.z_gong.x.y_1994
                parents:
                - taxon: curteocrinus
      - openTaxon: eocrinoidea-uncertain-order_parsley_zhao.y.l_2006
        children:
        - openTaxon: eocrinoidea-uncertain-family_parsley_zhao.y.l_2006
          children:
          - taxon: balangicystis
            new: true
            diagnosis: |
              Eocrinoid with ?five wedge-shaped basals above which in adult specimens
              at least six irregular circlets of polygonal plates with commonly five
              raised, flat-topped rays extend from plate center to plate angles.
              Sutural pores between thecal plates absent. Ten or 15 brachioles in
              an essentially transversely elongated 2-1 -2 pattern across upper face
              of the theca. Brachioles longer than height of theca and robust
              relative to thecal size. Tall cover plates present. Holdfast composed
              of short circlets of five or six platelets, some with prominent
              circular boss. At least 40 holdfast circlets present in juvenile
              and adult specimens.
            children:
            - taxon: rotundus_parsley_zhao.y.l_2006
              type: true
              new: true
              diagnosis: |
                Species is monotypic and its diagnosis is the same as for genus.
              synonyms:
              - openTaxon: crinozoa-sp_zhao.y.l_yuan.j.l_zhu.m.y_yang.r.d_guo.q.j_qian.y_huang.y.z_pan.y_1999
                parents:
                - openTaxon: crinozoa-genus_zhao.y.l_yuan.j.l_zhu.m.y_yang.r.d_guo.q.j_qian.y_huang.y.z_pan.y_1999
2006_sprinkle_collins.d:
  taxonomies:
  - taxon: blastozoa
    children:
    - taxon: eocrinoidea
      children:
      - taxon: gogiida
        children:
        - taxon: lyracystidae
          new: true
          diagnosis: |
            Eocrinoids having numerous, irregular, ridged thecal plates
            bearing epispires; three large distinctive lyre-shaped arms with
            numerous long, straight brachioles attached in central V; and
            a long multiplated stalk for attachment with domed, ridged,
            or spiny small plates.
          children:
          - taxon: lyracystis
            type: true
            new: true
            diagnosis: |
              Large eocrinoids with globular to rounded conical theca having
              numerous, irregular, ridge- and epispire-bearing thecal plates;
              three large lyre-shaped arms with biserial-to-triserial lateral
              trunks and numerous long straight brachioles in central V; and
              very long, thin, multiplated stalk for attach- ment with domed,
              ridged, or spiny small plates.
            children:
            - taxon: radiata_sprinkle_1973
              type: true
              diagnosis: |
                Globular to ellipsoidal theca with heavily ridged, larger
                primary plates and smaller secondary plates, both bearing
                scattered epispires, 4–5? wide, thick basals, summit probably
                domed with numerous small plates bearing epispires, central
                mouth, and lateral anal pyramid in wider (CD) interray; very
                long, thin stalk with domed proximal plates in diagonal whorls
                and slightly spiny medial and distal plating; and apparently
                three long lyre-shaped arms attached to edge of summit with up
                to 43 long, stiff brachioles in heart-shaped array between
                heavier V-shaped arm trunks.
              synonyms:
              - taxon: radiata_sprinkle_1973
                pars: true
                parents:
                - taxon: gogia
                  provisional: true
            - taxon: reesei_sprinkle_collins.d_2006
              new: true
              diagnosis: |
                Theca rounded conical, slightly longer than wide with domed
                summit, having about 60 primary and smaller secondary plates
                with scattered epispires on best side, 5–7 vertical ridges
                extending up from four basals, intersecting low horizontal
                ridge in mid-theca; only proximal segments of two lyre-shaped?
                biserial arms with smaller brachioles preserved; multiplated
                stalk very long, thin, slowly tapering away from thecal
                attachment, ridged proximally and spiny medially, distal
                attachment holdfast inferred but not preserved.
        - taxon: eocrinidae
          children:
          - taxon: gogia
            children:
            - taxon: prolifica_walcott_1917
              type: true
            - taxon: stephenensis_sprinkle_collins.d_2006
              new: true
              diagnosis: |
                Gogia with an ellipsoidal to rounded conical theca with
                moderate number of large and small plates, many elliptical
                epispires on larger thecal plates all over theca, relatively
                short thin stalk with many small plates, often flared distally
                into an enlarged circular structure, and 10–12 long, mostly
                straight brachioles that rarely spiral and may branch.
            synonyms:
            - taxon: radiata_sprinkle_1973
              pars: true
              parents:
              - taxon: gogia
                provisional: true
