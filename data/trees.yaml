  taxonomies:
  - taxon: crinoidea-family
    children:
    - taxon: sphaeronites
      notes: |
        No formal definitions or figures, just mentions in text.
        Most notable is the synonymization of E. granatum with E. aurantium,
        and the mention of E. pomum without synonymization (but with a note
        that E. pomum has not been seen near St. Peterburg.
      synonyms:
      - taxon: echinosphaerites
        authority:
          source: 1821_wahlenberg
          page: 52
          illustrations:
          - plate: I
            figures:
            - [14, 17]
        notes: |
          No indication of which figures go with which species; presumably
          Buch would retain the E. pomum figures with that species, and
          assign both the E. aurantium and E. granatum figures to
          E. aurantium.  But this is not spelled out as it is for some
          other sources.
      children:
      - taxon: aurantium_gyllenhaal_1772
        illustrations:
        - plate: I
          figures:
          - 14
          - 17
