[tool.poetry]
name = "phylohist"
version = "0.1.0"
description = ""
authors = ["Henry H. Andrews <andrews_henry@yahoo.com>"]
readme = "README.md"

[tool.poetry.scripts]
phylohist = 'phylohist.cli:main'

[tool.poetry.dependencies]
python = "^3.10"
coloredlog = "^0.2.5"
pyyaml = "^6.0.3"
jschon = "^0.11.1"
mcp = "^2.2.0"
anthropic = "^1.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8"
ruff = "^0.16.7"
pytest-cov = "^7.1.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::DeprecationWarning:rfc3986",
]

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py310"
extend-exclude = ["notes", "eval/runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
