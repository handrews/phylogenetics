unused: [type]
notes: >
  There is a lot of confusion over this paper vs Systema Naturae 12th edition.
  Gunnerus showed Linnaeus an early draft of some sort, with his two
  new Holothuria species and a new species Priapus polypus.
  Linnaeus apparently convinced Gunnerus that this "new" species was
  actually Priapus senilis.  Linnaeus also must have told Gunnerus
  about the genus Actinia he was planning to include in the 12th edition.
  Based on the work of Job Baster ("Natuurkundige uitspanningen, behelzende
  eenige waarneemingen over sommige zee-planten en zee-insecten" in Dutch or
  "Opuscula subseciva, observationes miscellaneas de animalculis et plantis
  quibusdam marinis, eorumque ovariis et seminibus continentia" in Latin,
  published in several pieces simultaneously in both languages between 1759
  and 1765), Gunnerus explicitly re-assigns senilis to Actinia, despite
  Actinia not having been published yet.  As this paper came out before
  the 12th edition, the two Holothuria species are attributed to Gunnerus.
  But as Gunnerus did not claim authorship of Actinia, it is attributed
  to Linnaeus even though the 12th edition came out a few months later.
