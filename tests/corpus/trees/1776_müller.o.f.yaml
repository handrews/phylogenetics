      - taxon: medusa
      - taxon: asterias
        notes: >
          Like Linnaeus, Müller uses informal headings to group the species:
          Lunatae (A. equestris – A. militaris), Stellatae (A. phrygiana –
          A. sanguinolenta), and Radiatae (A. rosea – A. caputmedusae).
          Note that his Lunatae appears to replace Linnaeus's Integra,
          which contained only A. luna which is not included here.
          A. equestris was in Linnaeus's Stellatae; otherwise those
          species included both here and in Linnaeus's 12th edition appear
          to be in the same sections.
        children:
        - taxon: equestris_linnaeus_1758
          sectionStart:
            section: lunatae
            new: true
            pages: 233
            citedAs: "* Lunatæ."
            editorial:
              inferred: [new]
              basis: No known prior source.
        - taxon: pulvillus_müller.o.f_1776
          new: true
        - taxon: militaris_müller.o.f_1776
          new: true
          sectionEnd: lunatae
        - taxon: phrygiana_parelius_1768
          sectionStart:
            section: stellatae
        - taxon: rubens_linnaeus_1758
        - taxon: aranciaca_linnaeus_1758
