          new: true
        - taxon: minuta_linnaeus_1761
        - taxon: sanguinolenta_müller.o.f_1776
          new: true
          sectionEnd: stellatae
        - taxon: rosea_müller.o.f_1776
          new: true
          sectionStart:
            section: radiatae
        - taxon: glacialis_linnaeus_1758
        - taxon: pertusa_müller.o.f_1776
          new: true
        - taxon: ophiura_linnaeus_1758
        - taxon: aculeata_linnaeus_1767
        - taxon: ciliata_müller.o.f_1776
