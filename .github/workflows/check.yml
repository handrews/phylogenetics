name: check
on:
  push:
    branches: [main, productize]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - run: pip install poetry
    - run: poetry install
    - run: poetry run pytest
    - run: poetry run python scripts/schema_audit.py --markdown scripts/schema-usage.md
    - run: git diff --exit-code scripts/schema-usage.md
    - run: poetry run python scripts/claims.py
    - run: git diff --exit-code claims/
