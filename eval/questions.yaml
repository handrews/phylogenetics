    answer: |
      No consensus; three positions are on record. Bassler (1935), Dehm
      (1961) and Regnell (1966) all keep it in Pyrgocystis (Dehm's own trees
      lists it as a comparandum to coronaeformis but never moves it into his
      new subgenus Rhenopyrgus, p. 15-16). Holloway & Jell (1983) assert "P.
