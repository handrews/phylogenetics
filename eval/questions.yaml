- id: q029
  class: conflict
  question: Where do sources place family Rhenopyrgidae (or its subfamily-rank predecessor) across the
    1983-2020 literature?
  scope:
    taxon: rhenopyrgidae
  expected:
    claims:
    - kind: placement
      source: 1983_holloway_jell
      subject: rhenopyrgidae
      parent: edrioasteroidea-order-uncertain_holloway_jell_1983
    - kind: placement
      source: 1994_guensburg_sprinkle
      subject: rhenopyrginae
      parent: cyathocystidae
    - kind: placement
      source: 2000_grigo
      subject: rhenopyrginae
      parent: cyathocystidae
    - kind: placement
