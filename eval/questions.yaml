- id: q036
  class: conflict
  question: 'At what rank do the sources treat Edrioblastoidea: a class, an order, or a suborder?'
  scope:
    taxon: edrioblastoidea
  expected:
    claims:
    - kind: act
      source: 1962_fay
      actKind: new
      subject: edrioblastoidea
    - kind: placement
      source: 1990_smith.a.b_jell
      subject: astrocystitidae
      parent: edrioblastoida
    - kind: act
      source: 1994_guensburg_sprinkle
      actKind: nomTransl
      subject: edrioblastoidina
    - kind: usage
      source: 2020_ewin_martin.m_isotalo_zamora
      subject: edrioblastoidina
      printed:
        citedAs: Suborder Edrioblastoidina Fay, 1962
    answer: |
      All three, by source. Fay (1962) erects it as a class (p. 201). Smith & Jell (1990) and Zhu et al. (2014) use the order Edrioblastoida. Guensburg & Sprinkle (1994) translate it to the suborder Edrioblastoidina (p. 12), which Sumrall et al. (2013), Briggs et al. (2017) and Ewin et al. (2020) follow, still crediting "Fay, 1962" (2020 p. 118). The records keep one name at three ranks: edrioblastoidea (Class), edrioblastoida (Order) and edrioblastoidina as a rank variant of the class.
  evidence:
  - source: 1962_fay
    pages: 201
  - source: 1994_guensburg_sprinkle
    pages: 12
  - source: 2020_ewin_martin.m_isotalo_zamora
    pages: 118
  verified: data/trees/1962_fay.yaml taxonomies/0 (edrioblastoidea new); data/trees/1990_smith.a.b_jell.yaml
    (edrioblastoida > astrocystitidae); data/trees/1994_guensburg_sprinkle.yaml (edrioblastoidina, modifier
    nomen transl., emended); data/trees/2020_ewin_martin.m_isotalo_zamora.yaml (edrioblastoidina citedAs);
    data/taxa.yaml edrioblastoidea/edrioblastoida/edrioblastoidina records.
