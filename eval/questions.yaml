- id: q008
  class: answerable
  question: In Holloway & Jell (1983), family Rhenopyrgidae is placed under a name that is not itself
    an order. What is that placeholder, and what does it mean?
  scope:
    taxon: rhenopyrgidae
    source: 1983_holloway_jell
  expected:
    claims:
    - kind: act
      source: 1983_holloway_jell
      actKind: new
      subject: rhenopyrgidae
    - kind: placement
      source: 1983_holloway_jell
      subject: rhenopyrgidae
      parent: edrioasteroidea-order-uncertain_holloway_jell_1983
      placeholder: uncertain
    - kind: placement
      source: 1983_holloway_jell
      subject: edrioasteroidea-order-uncertain_holloway_jell_1983
      parent: edrioasteroidea
      placeholder: uncertain
    answer: |
      "Class EDRIOASTEROIDEA / Order UNCERTAIN / Family RHENOPYRGIDAE n. fam."
      (p. 1002). The placeholder is not a heterogeneous bin and not simply
      "unnamed": the text weighs two specific, named candidate orders
      (Isorophida vs. Edrioasterida) for the new family and cannot choose
      between them (pp. 1002-1004).
  evidence:
    source: 1983_holloway_jell
    pages:
    - 1002
    - 1004
  verified: data/trees/1983_holloway_jell.yaml, taxonomies/0(edrioasteroidea)/children/0(openTaxon edrioasteroidea-order-uncertain_holloway_jell_1983)/children/0(rhenopyrgidae,
    new); docs/reviews/review_1983_holloway_jell.md sec. 2-3 quotes the p.1002 heading and the pp.1002-1004
    two-sided argument.
