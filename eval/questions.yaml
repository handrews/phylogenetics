- id: q012
  class: answerable
  question: Which two genera does Ewin et al. (2020) list under the emended family Rhenopyrgidae?
  scope:
    taxon: rhenopyrgidae
    source: 2020_ewin_martin.m_isotalo_zamora
  expected:
    blocks:
    - tool: contents
      parameters: {source: 2020_ewin_martin.m_isotalo_zamora, record: rhenopyrgidae}
    shows:
    - "Genus Rhenopyrgus"
    - "Genus Heropyrgus"
    answer: |
      Rhenopyrgus Dehm, 1961 and Heropyrgus Briggs et al., 2017: "Diagnosis
      (Emended).—... Genera included.—Rhenopyrgus Dehm, 1961; Heropyrgus
      Briggs et al., 2017" (p. 118). The emendation broadens the family to
      admit ambulacral floor and interradial oral plates that "may or may not
      be fused," since R. grayae does not fuse them while other species do.
  evidence:
