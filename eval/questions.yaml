- id: q029
  class: trajectory
  question: Where do sources place family Rhenopyrgidae (or its subfamily-rank predecessor) across the
    1983-2020 literature?
  scope:
    taxon: rhenopyrgidae
  expected:
    blocks:
    - tool: placements
      parameters: {records: [rhenopyrgidae]}
    shows:
    - Cyathocystidae
    - Edrioblastoidina
    - "Order uncertain"
    answer: |
      Three papers in the corpus hold the present position — family
      Rhenopyrgidae directly under suborder Edrioblastoidina — over 2013 to
      2020, from three distinct sets of co-authors with no individual
      appearing in more than one: Sumrall, Heredia Rodríguez & Mestre (2013),
      Briggs, Siveter, Siveter, Sutton & Rahman (2017), and Ewin, Martin,
      Isotalo & Zamora (2020).

      Holloway & Jell (1983) are the first to erect the family, leaving its
      order "UNCERTAIN" between Isorophida and Edrioasterida (pp. 1002-1004).
      Guensburg & Sprinkle (1994) instead rerank it down to subfamily
      Rhenopyrginae inside family Cyathocystidae (p. 21), a placement Grigo
      (2000) — the last paper in the corpus to hold it — repeats. Sumrall,
      Heredia Rodríguez & Mestre (2013) reject that nesting explicitly, citing
      their own phylogenetic results: "we do not include them within
      Cyathocystidae Bather, 1899, but leave them assigned at family level
      within Edrioblastoidina Fay, 1962" (p. 773).
  evidence:
  - source: 1983_holloway_jell
    pages: 1002
  - source: 1994_guensburg_sprinkle
    pages: 21
  - source: 2013_sumrall_heredia_rodríguez.c.m_mestre
    pages: 773
  verified: data/trees/1983_holloway_jell.yaml, data/trees/1994_guensburg_sprinkle.yaml, data/trees/2000_grigo.yaml,
    data/trees/2013_sumrall_heredia_rodríguez.c.m_mestre.yaml, data/trees/2017_briggs.d.e.g_siveter.de.j_siveter.da.j_sutton.m.d_rahman.yaml
    and data/trees/2020_ewin_martin.m_isotalo_zamora.yaml each show the stated parent node for rhenopyrgidae/rhenopyrginae;
    authors for the three present-position papers per sources.yaml (sumrall/heredia/rodríguez.c.m/mestre;
    briggs.d.e.g/siveter.de.j/siveter.da.j/sutton.m.d/rahman; ewin/martin.m/isotalo/zamora) share no name;
    notes/reviews/review_2013_sumrall_heredia_rodríguez.c.m_mestre.md quotes the p.773 declination verbatim.
- id: q030
  class: trajectory
  question: Is Rhenopyrgus a genus or a subgenus of Pyrgocystis?
  scope:
    taxon: rhenopyrgus
  expected:
    blocks:
    - tool: history
      parameters: {record: rhenopyrgus}
    shows:
    - "genus since 1983"
    - "subgenus 1961–1966"
    answer: |
      Proposed as a subgenus of Pyrgocystis by Dehm (1961) and kept so by
      Regnéll (1966), Rhenopyrgus has been treated as a genus by every paper
      in the corpus from Holloway & Jell (1983) on: six papers to 2020, from
      six distinct sets of co-authors, with Jell appearing in two of them
      (Holloway & Jell, 1983, and Smith & Jell, 1990, in a cladogram
      placement) — Holloway, Guensburg, Sprinkle, Grigo, Sumrall, Heredia
      Rodríguez, Mestre, Ewin, Martin, Isotalo and Zamora each contribute no
      more than one of the six papers.

      Dehm (1961) coins the subgenus in the phrase "eine eigene Untergattung,
      Rhenopyrgus nov. subgen." (p. 16). Regnéll (1966) is the last paper in
      the corpus to hold the subgenus position. Holloway & Jell (1983)
      elevate it to genus and argue against both predecessors: "Although
      considered to be a subgenus of Pyrgocystis by Dehm (1961) and Regnell
      (1966), Rhenopyrgus differs from that taxon... In fact the differences
      are so great that we discount the possibility of an evolutionary
      relationship between these genera, as suggested by Dehm (1961)."
      (p. 1004). No paper in the corpus after 1983 returns to the subgenus
      rank.
  evidence:
  - source: 1961_dehm
    pages: 16
  - source: 1983_holloway_jell
    pages: 1004
  - source: 1994_guensburg_sprinkle
    pages: 21
  - source: 2020_ewin_martin.m_isotalo_zamora
    pages: 118
  verified: 'data/taxa.yaml carries both rhenopyrgus (genus, no rank field) and rhenopyrgus-subgenus (rank:
    subgenus) as separate records, both auth [Dehm] year 1961; data/trees/1961_dehm.yaml keys the node
    `taxon: rhenopyrgus` with a `rank: subgenus` override; data/trees/1966_regnéll.yaml, .../pyrgocystis/children/1(rhenopyrgus-subgenus)/children/0(coronaeformis_rievers_1961,
    type) — no `pages` on that node; data/trees/1983_holloway_jell.yaml uses the bare genus key `rhenopyrgus`;
    data/trees/1990_smith.a.b_jell.yaml phylogenies/0 and phylogenies/1 both place `taxon: rhenopyrgus`
    alongside `cambroblastus`/`totiglobus` (genus-level names) with no rank field, since this source has
    no `taxonomies` entry for the genus itself; data/trees/1994_guensburg_sprinkle.yaml, data/trees/2000_grigo.yaml,
    data/trees/2013_sumrall_heredia_rodríguez.c.m_mestre.yaml and data/trees/2020_ewin_martin.m_isotalo_zamora.yaml
    each carry a bare `rhenopyrgus` genus node; author lists per sources.yaml confirm the six sets are
    pairwise distinct except for the shared name Jell (1983, 1990); notes/reviews/review_1983_holloway_jell.md
    sec. 3 quotes the p.1004 argument in full. Could not confirm any node placing Rhenopyrgus (or a synonym
    of it) at genus rank in 1930_richter.r or 1935_bassler — neither tree has the name at all.'
- id: q031
  class: trajectory
  question: What genus is Pyrgocystis octogona (Richter, 1930) placed in across the corpus?
  scope:
    taxon: octogona_richter.r_1930
  expected:
    blocks:
      anyOf:
      - - tool: placements
          parameters: {records: [octogona_richter.r_1930]}
      - - tool: history
          parameters: {record: octogona_richter.r_1930}
    shows:
    - "Pyrgocystis octogona"
    answer: |
      Two papers with an actual placement in the corpus, both before 1962,
      keep the species in Pyrgocystis: Bassler (1935) and Dehm (1961), the
      latter listing it only as a comparandum beside his new subgenus
      Rhenopyrgus, never moving it in (pp. 15-16): "es [ist] erforderlich,
      diese Formen gesondert zu halten" ("it is necessary to keep these forms
      separate," p. 16).

      No later paper in the corpus carries a placement of its own for the
      species. Holloway & Jell (1983) instead state in passing that "P.
      octogona Richter, 1930 was assigned to Rhenopyrgus by Dehm (1961)"
      (p. 1004) — a description that does not match Dehm's own printed text,
      quoted above. Klug et al. (2008), a paper not itself part of this
      corpus, is reported by Müller & Hahn (2010) as classifying
      the species under Pyrgocystis on the grounds that its "scale tube...
      consists of vertical keeled rows"; Müller & Hahn (2010) call that
      assignment "unlikely," again without placing the species themselves.
  evidence:
  - source: 1935_bassler
  - source: 1961_dehm
    pages: 16
  - source: 1983_holloway_jell
    pages: 1004
  - source: 2010_müller.p_hahn
  verified: data/trees/1935_bassler.yaml and data/trees/1961_dehm.yaml both place octogona_richter.r_1930
    under `pyrgocystis` (neither node carries a `pages` field). Could not confirm octogona_richter.r_1930
    in data/trees/1966_regnéll.yaml — grepped and it is not present there; that source's `pyrgocystis`
    node lists only `pyrgocystis-subgenus` (sardesoni, sulcata) and `rhenopyrgus-subgenus` (coronaeformis)
    as children, so an earlier version of this question's verification (crediting 1966 as a third placement)
    does not hold and has been dropped. data/trees/2010_müller.p_hahn.yaml has no octogona node at all
    and lists `rhenopyrgidae` with no children; notes/reviews/review_1983_holloway_jell.md sec. 3 quotes
    the p.1004 claim and Dehm's contrary conclusion; data/sources.yaml's notes for 2010_müller.p_hahn
    (~line 3734) carry the Klug et al. (2008)/Müller & Hahn dispute in translated paraphrase, not a `quotes`
    block, and are not themselves a placement claim on any tree.
- id: q032
  class: trajectory
  question: What class or order has Astrocystites been placed in, across the sources that treat it?
  scope:
    taxon: astrocystites
  expected:
    blocks:
    - tool: ancestors
      parameters: {records: [astrocystites]}
    shows:
    - Edrioblastoidea
    - Protoblastoidea
    - Edrioblastoidina
    answer: |
      Astrocystites has sat in five different higher groups in the corpus. Bassler (1935) keeps it in class Edrioasteroidea under the heading "POSITION UNCERTAIN" (p. 10), noting Blastoidea as an alternative; Bassler (1936) places it in order Protoblastoidea of class Blastoidea, on the sentence that such genera "might well be assigned to the Protoblastoidea, the first order of blastoids" (p. 23). Fay (1962) gives it a class of its own, Edrioblastoidea, with no order or family between (p. 201). Fay (1967) and Sprinkle (1982) interpose order Pentacystida within that class, under superclass Crinozoa and Echinozoa respectively; Webby (1968) and Mintz (1970) keep the class without an order. From Smith & Jell (1990) the genus is back in class Edrioasteroidea: in order Edrioblastoida for Smith & Jell (1990), Zhu, Zamora & Lefebvre (2014) and Jell & Sprinkle (2021), and in order Edrioasterida, suborder Edrioblastoidina, for Guensburg & Sprinkle (1994), Sprinkle & Sumrall (2015) and the rhenopyrgid papers of 2013–2020. The last paper to hold the class rank is Sprinkle (1982); the last to place the genus outside Edrioasteroidea, apart from Bassler (1936), is Sprinkle (1982) as well.
  evidence:
  - source: 1935_bassler
    pages: 10
  - source: 1936_bassler
    pages: 23
  - source: 1962_fay
    pages: 201
  - source: 1994_guensburg_sprinkle
    pages: 13
  verified: data/trees/1935_bassler.yaml (astrocystitidae node, new/provisional, altPlacements [blastoidea]);
    data/trees/1936_bassler.yaml (taxonomies/0/children/1(blastoidea)/children/0(protoblastoidea)/children/0(astrocystites,
    provisional)); data/trees/1962_fay.yaml (taxonomies/0(edrioblastoidea)/children/0(astrocystites));
    data/trees/1990_smith.a.b_jell.yaml and data/trees/1994_guensburg_sprinkle.yaml both nest astrocystitidae
    under edrioblastoida/edrioblastoidina respectively, from disjoint author sets (smith.a.b+jell vs.
    guensburg+sprinkle) per sources.yaml; data/trees/1967a_fay.yaml, data/trees/1970_mintz.yaml and data/trees/1982i_sprinkle.yaml
    each keep astrocystites under class edrioblastoidea; notes/reviews/review_1936_bassler.md sec.4 quotes
    the p.23 sentence; notes/audits/source-observations.md 1994 section cites the Systematic Paleontology header
    at p.13.
- id: q033
  class: trajectory
  question: What do the papers in the corpus print as the attribution of family Edrioasteridae, name-bearer and year? Is it Bather 1898 or 1899?
  scope:
    taxon: edrioasteridae
  expected:
    blocks:
    - tool: printed_forms
      parameters: {record: edrioasteridae}
    shows:
    - "Bather, 1899"
    - "Bell, 1976"
    answer: |
      One paper in the corpus prints a year for family Edrioasteridae's
      attribution to Bather: Sprinkle & Sumrall (2015), citing "Bather, 1899"
      (p. 348) — printed four lines below "Suborder Edrioasterina, Bather,
      1898" for the coordinate suborder name, in the same header, from the
      same two authors.

      Bell & Sprinkle (1978), the only other paper in the corpus that prints
      any year at all for the family, instead credit it to an entirely
      different name-bearer: "Family Edrioasteridae Bell, 1976 [emend.
      herein]" (p. 246), tracing to "the order Edrioasterida as proposed by
      Bell (1976a)" (p. 245). No paper in the corpus explains why 1898 and
      1899 both appear for the same 1899 British Association report, itself
      dated "for 1898."
  evidence:
  - source: 2015_sprinkle_sumrall
    pages: 348
  - source: 1978_bell.b.m_sprinkle
    pages: 246
  verified: data/taxa.yaml edrioasteridae record and its `notes` field; data/trees/2015_sprinkle_sumrall.yaml
    taxonomies/0/children/0/children/0(edrioasterina)/children/0(edrioasteridae), neither node carrying
    an override year; notes/reviews/review_2015_sprinkle_sumrall.md sec.2-3 quotes both printed years verbatim.
- id: q034
  class: trajectory
  question: Who does the corpus credit as the author of Cambraster, and does every source agree?
  scope:
    taxon: cambraster
  expected:
    blocks:
      anyOf:
      - - tool: printed_forms
          parameters: {record: cambraster}
      - - tool: statements
          parameters: {record: cambraster}
    shows:
    - "Cabibel, Termier, and Termier, 1958"
    answer: |
      Two papers in the corpus print an author and year for Cambraster,
      twenty-seven years apart, both crediting the same trio: Guensburg &
      Sprinkle (1994), "Cambraster Cabibel, Termier, and Termier, 1958"
      (p. 42), and Jell & Sprinkle (2021), "Cambraster Cabibel et al., 1958"
