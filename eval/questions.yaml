    - kind: placement
      source: 2020_ewin_martin.m_isotalo_zamora
      subject: rhenopyrgidae
      parent: edrioblastoidina
    answer: |
      No single placement holds across the corpus; each source's own tree is
      reported without adjudicating between them. Holloway & Jell (1983)
      leave the family's order "UNCERTAIN" between Isorophida and
      Edrioasterida (p. 1002). Guensburg & Sprinkle (1994) rerank it down to
      subfamily Rhenopyrginae inside family Cyathocystidae (p. 21), a
      placement Grigo (2000) repeats. Sumrall et al. (2013), Briggs et al.
      (2017) and Ewin et al. (2020) all instead keep it a family, directly
      under suborder Edrioblastoidina, explicitly declining the Cyathocystidae
      nesting: "we do not include them within Cyathocystidae Bather, 1899,
      but leave them assigned at family level within Edrioblastoidina Fay,
      1962" (2013, p. 773).
