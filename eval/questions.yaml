- id: q041
  class: trajectory
  question: Which papers in the corpus treat edrioblastoids, and what does each do to the group?
  scope:
    taxon: edrioblastoidea
  expected:
    blocks:
    - tool: history
      parameters: {record: edrioblastoidea}
    shows:
    - "named as new"
    - "nomen translatum"
    - "Smith & Jell"
    answer: |
      By year, across the papers in the corpus that treat the group (the Astrocystitidae and the Rhenopyrgidae together): Bather (1900) erects new family Steganoblastidae under class Edrioasteroidea. Bassler (1935) erects "new" family Astrocystitidae (his own correction of Steganoblastidae) under Edrioasteroidea, heading the section "position uncertain," and separately notes an alternative placement in Blastoidea. Bassler (1936), the following year, moves the genus into order Protoblastoidea under class Blastoidea instead. Rievers (1961) describes a new species, Pyrgocystis coronaeformis, with no family-level act; Dehm (1961) adds new subgenus Rhenopyrgus within Pyrgocystis for it. Fay (1962) erects new class Edrioblastoidea directly over genus Astrocystites, removing it from Edrioasteroidea. Regnéll (1966) keeps Rhenopyrgus at subgenus rank, now under family Hemicystitidae. Fay's Treatise entry (1967) nests class Edrioblastoidea, with an interposed order Pentacystida, under superclass Crinozoa. Webby (1968) adds new species Astrocystites distans and argues, citing Art. 40 of the Code, for retaining the family name Steganoblastidae over Astrocystitidae. Mintz (1970) keeps family Astrocystitidae directly under class Edrioblastoidea under Crinozoa, with no interposed order. Bell (1980) places genus Astrocystites in family Astrocystitidae under class Edrioblastoidea, as a separate entry from his own coverage of Pyrgocystis under Isorophida, with no further act. Sprinkle's 1982 entry in the same reference series keeps family Steganoblastidae under class Edrioblastoidea under superclass Echinozoa. Holloway & Jell (1983) erect new family Rhenopyrgidae, leaving its order "UNCERTAIN," and elevate Rhenopyrgus from subgenus to genus. Smith & Jell (1990) re-rank the group as order Edrioblastoida within class Edrioasteroidea and add new genus Cambroblastus to family Astrocystitidae. Guensburg & Sprinkle (1994) translate the class to suborder Edrioblastoidina within order Edrioasterida, add new genus Lampteroblastus, and re-rank Rhenopyrgidae down to subfamily Rhenopyrginae within an emended family Cyathocystidae. Grigo (2000) follows that 1994 placement, keeping Rhenopyrginae within Cyathocystidae, and adds a new species of Rhenopyrgus. Müller & Hahn (2010) list family Rhenopyrgidae with no genera assigned to it, and dispute in prose a move of Pyrgocystis octogona reported for Klug et al. (2008). Sumrall, Heredia Rodríguez & Mestre (2013) emend family Rhenopyrgidae and genus Rhenopyrgus, place the family directly under suborder Edrioblastoidina, and decline the Cyathocystidae placement; they add new species piojoensis. Zhu, Zamora & Lefebvre (2014) add new species Cambroblastus guolensis within order Edrioblastoida. Sprinkle & Sumrall (2015) add new genus Porosublastus to family Astrocystitidae under suborder Edrioblastoidina. Briggs, Siveter, Siveter, Sutton & Rahman (2017) add new genus Heropyrgus to family Rhenopyrgidae under suborder Edrioblastoidina. Ewin, Martin, Isotalo & Zamora (2020) emend family Rhenopyrgidae, broadening it to admit both fused and unfused ambulacral floor plates, and add new species viviani. Jell & Sprinkle (2021) add new genus Ikerus to order Edrioblastoida. By 2021, the group sits as class Edrioasteroidea > order or suborder Edrioblastoida(-ina) > families Astrocystitidae and Rhenopyrgidae, the two conventions for the middle rank running in parallel rather than one having replaced the other.
  evidence:
  - source: 1900_bather
  - source: 1935_bassler
    pages: 10
  - source: 1936_bassler
    pages: 23
  - source: 1962_fay
    pages: 201
  - source: 1968_webby
    pages: 514
  - source: 1983_holloway_jell
    pages:
    - 1002
    - 1004
  - source: 1994_guensburg_sprinkle
    pages:
    - 12
    - 21
  - source: 2000_grigo
    pages: 95
  - source: 2013_sumrall_heredia_rodríguez.c.m_mestre
    pages: 773
  - source: 2015_sprinkle_sumrall
    pages: 348
  - source: 2017_briggs.d.e.g_siveter.de.j_siveter.da.j_sutton.m.d_rahman
    pages: 2
  - source: 2020_ewin_martin.m_isotalo_zamora
    pages: 118
  - source: 2021_jell_sprinkle
  verified: gold_inventory.md "## Trees" section lists 24 gold-slice trees; cross-checked directly against
    each tree file (data/trees/1900_bather.yaml through data/trees/2021_jell_sprinkle.yaml). Two entries
    in that inventory's own summary lines proved incomplete on direct inspection and are corrected here
    from the tree files themselves — data/trees/1980_bell.b.m.yaml has a second, separate taxonomies entry
    (edrioblastoidea > astrocystitidae > astrocystites) that gold_inventory.md's one-line summary omits;
    data/trees/1982_bell.b.m.yaml (36 lines, one taxonomies entry rooted at echinodermata) has no edrioblastoid-related
    content at all — could not confirm this source treats the group, despite notes/audits/source-observations.md-style
    expectations elsewhere; it is described here as covering unrelated isorophid/agelacrinitid/cyathocystid
    material only. data/trees/2010_müller.p_hahn.yaml's `rhenopyrgidae` node has zero children (confirmed
    by direct read). notes/reviews/review_1968_webby.md sec.3 quotes the Art. 40 passage (p. 514) in full.
- id: q042
  class: trajectory
  question: What genera and species have ever been classified as edrioblastoids by any definition, and
    which of those placements were later abandoned by some sources?
  scope:
    taxon: edrioblastoidea
  expected:
    blocks:
    - tool: descendants
      parameters: {records: [edrioblastoidea]}
    shows:
    - Astrocystites
    - Cambroblastus
    - Steganoblastidae
    answer: |
      Taking the union across every source that nests a name under Edrioblastoidea, Edrioblastoida, Edrioblastoidina, Astrocystitidae or Steganoblastidae — plus Cyathocystidae and Rhenopyrginae wherever a source itself nests those under Edrioblastoidina — the genera on record are: Astrocystites (species ottawaensis, distans, and several open-nomenclature entries), Cambroblastus (enubilatus, guolensis), Lampteroblastus (hintzei), Porosublastus (inexpectus), Ikerus (edgari), Cyathocystis (no species under this particular nesting), Rhenopyrgus (coronaeformis, and, only in Ewin et al. 2020, which nests the family there: grayae, whitei, flos, piojoensis and viviani), and Heropyrgus (disterminus). Some of these placements are later abandoned by other sources. Astrocystites itself moves out of every edrioblastoid-labelled bin for one paper, Bassler (1936), which places it in order Protoblastoidea under class Blastoidea instead — a placement no later paper in the corpus repeats. The nesting of genus Cyathocystis and Rhenopyrgus (as subfamily Rhenopyrginae) inside family Cyathocystidae, held by Guensburg & Sprinkle (1994) and Grigo (2000), is abandoned by every paper in the corpus from Sumrall, Heredia Rodríguez & Mestre (2013) on, which instead place family Rhenopyrgidae directly under suborder Edrioblastoidina. And the group's standing as its own class outside Edrioasteroidea altogether — held from Fay (1962) through Sprinkle (1982) — is abandoned by every paper in the corpus from Smith & Jell (1990) on, which return it to class Edrioasteroidea as an internal order or suborder.
  evidence:
  - source: 1994_guensburg_sprinkle
    pages:
    - 12
    - 21
  - source: 2000_grigo
    pages: 95
  - source: 2013_sumrall_heredia_rodríguez.c.m_mestre
    pages: 773
  - source: 1936_bassler
    pages: 23
  verified: Union compiled by direct inspection of data/trees/1900_bather.yaml, 1935_bassler.yaml, 1936_bassler.yaml,
    1962_fay.yaml, 1967a_fay.yaml, 1968_webby.yaml, 1970_mintz.yaml, 1980_bell.b.m.yaml, 1982i_sprinkle.yaml,
    1990_smith.a.b_jell.yaml, 1994_guensburg_sprinkle.yaml, 2000_grigo.yaml, 2013_sumrall_heredia_rodríguez.c.m_mestre.yaml,
    2014_zhu.x.j_zamora_lefebvre.yaml, 2015_sprinkle_sumrall.yaml, 2017_briggs.d.e.g_siveter.de.j_siveter.da.j_sutton.m.d_rahman.yaml,
    2020_ewin_martin.m_isotalo_zamora.yaml and 2021_jell_sprinkle.yaml. 1982_bell.b.m.yaml checked and
    confirmed to carry none of these names under any of the listed bins. Cambraster is deliberately excluded
    — every source that names it (1990, 1994, 2021) places it in an "order/family uncertain" bin coordinate
    with, not nested inside, Edrioblastoidina.
- id: q043
  class: trajectory
  question: At what rank has the edrioblastoid group been treated, and by which co-author sets, over time?
  scope:
    taxon: edrioblastoidea
  expected:
    blocks:
    - tool: history
      parameters: {record: edrioblastoidea}
    shows:
    - "co-author sets"
    - "order since 1990"
    answer: |
      Fourteen papers in the corpus place the group at one of three ranks,
      with two conventions running in parallel from 1990 on rather than one
      replacing the other.

      Six papers hold suborder rank, Edrioblastoidina, from 1994 to 2020,
      from six distinct sets of co-authors: Guensburg & Sprinkle (1994),
      Grigo (2000), Sumrall, Heredia Rodríguez & Mestre (2013), Sprinkle &
      Sumrall (2015), Briggs, Siveter, Siveter, Sutton & Rahman (2017), and
      Ewin, Martin, Isotalo & Zamora (2020) — Sprinkle appearing in two of
      them (1994, 2015) and Sumrall in two (2013, 2015), overlaps of
      individuals, not a merged position.

      Three papers hold order rank, Edrioblastoida, spanning 1990 to 2021,
      from three distinct sets of co-authors: Smith & Jell (1990), Zhu,
      Zamora & Lefebvre (2014), and Jell & Sprinkle (2021) — Jell appearing
      in two of them. This order-rank usage is not simply earlier than the
      suborder-rank usage: Jell & Sprinkle's order-rank paper (2021) is a
      year later than Ewin et al.'s suborder-rank paper (2020).

      Earlier still, five papers in the corpus treat the group as a class,
      Edrioblastoidea, from 1962 to 1982, from four distinct sets of
      co-authors (Fay appearing twice, in 1962 and 1967): Fay (1962,
      erecting it new, p. 201), Fay (1967), Webby (1968), Mintz (1970), and
      Sprinkle (1982). Guensburg & Sprinkle (1994) are the first paper in the
      corpus to use the suborder form, printing it as a nomen translatum
      from the class (p. 12); Ewin et al. (2020), a more recent suborder-rank
      paper, still credit that name to "Fay, 1962" (p. 118). Bell's 1982
      chapter in the same reference volume as Sprinkle's could not be
      confirmed to treat the group at all — see verified.
  evidence:
  - source: 1962_fay
    pages: 201
  - source: 1994_guensburg_sprinkle
    pages: 12
  - source: 2020_ewin_martin.m_isotalo_zamora
    pages: 118
  verified: Class-rank papers confirmed directly in data/trees/1962_fay.yaml, 1967a_fay.yaml, 1968_webby.yaml,
    1970_mintz.yaml and 1982i_sprinkle.yaml (all carry a bare or Crinozoa/Echinozoa-nested `edrioblastoidea`
    node). Order-rank papers confirmed in data/trees/1990_smith.a.b_jell.yaml, 2014_zhu.x.j_zamora_lefebvre.yaml
    and 2021_jell_sprinkle.yaml (`edrioblastoida`). Suborder-rank papers confirmed in data/trees/1994_guensburg_sprinkle.yaml,
    2000_grigo.yaml, 2013_sumrall_heredia_rodríguez.c.m_mestre.yaml, 2015_sprinkle_sumrall.yaml, 2017_briggs.d.e.g_siveter.de.j_siveter.da.j_sutton.m.d_rahman.yaml
    and 2020_ewin_martin.m_isotalo_zamora.yaml (`edrioblastoidina`). Author sets per sources.yaml confirm
    the stated overlaps (fay/fay; jell/jell; sprinkle in 1994+2015; sumrall in 2013+2015). Could not confirm
    data/trees/1982_bell.b.m.yaml treats the group at any rank — the file (36 lines) has no `edrioblastoidea`/`edrioblastoida`/`edrioblastoidina`
    node anywhere, so "Bell 1982" is not counted among the five class-rank papers here, unlike some informal
    lists of this literature which include it.
- id: q044
  class: trajectory
  question: Which family name has been used for Astrocystites and by whom, Steganoblastidae or Astrocystitidae?
  scope:
    taxon: astrocystitidae
  expected:
    blocks:
    - tool: history
      parameters: {record: astrocystites}
    shows:
    - "in Steganoblastidae"
    - "in Astrocystitidae"
    answer: |
      Three papers in the corpus use Steganoblastidae: Bather (1900, erecting
      it new), Webby (1968), and Sprinkle (1982). Seven use Astrocystitidae: Bassler (1935, printed as a "new name"),
      Fay (1967), Mintz (1970), Bell (1980), Smith & Jell (1990), Guensburg &
      Sprinkle (1994), and Sprinkle & Sumrall (2015).

      Bather (1900) erects the family for a genus, Steganoblastus, that
      Whiteaves had introduced in 1898 at Bather's own suggestion, after
      Bather objected to Whiteaves's original name Astrocystites as liable to
      confusion with Asterocystis. Bassler (1935) restores Whiteaves's
      original genus name on grounds of priority and introduces the
      replacement family name Astrocystitidae to go with it. Webby (1968)
      retains Steganoblastidae instead, arguing that although it "is based on
      a junior objective synonym," it "has priority and has been a more
      widely used name," citing Art. 40 of the International Code of
      Zoological Nomenclature (p. 514) — Fay (1967), Mintz (1970),
      Bell (1980), Smith & Jell (1990), Guensburg & Sprinkle (1994) and
      Sprinkle & Sumrall (2015) use Astrocystitidae; Fay's Treatise entry
      precedes Webby's paper by a year. Sprinkle's own 1982 entry, printed after Mintz's 1970
      use of Astrocystitidae, reverts to Steganoblastidae.
  evidence:
  - source: 1900_bather
  - source: 1935_bassler
    pages: 10
  - source: 1968_webby
    pages: 514
  verified: 'Steganoblastidae confirmed as `new: true` in data/trees/1900_bather.yaml; carried in data/trees/1968_webby.yaml
    and data/trees/1982i_sprinkle.yaml. Astrocystitidae confirmed as `new: true, provisional: true` in
    data/trees/1935_bassler.yaml (notes: "given as \"new name\""); carried in data/trees/1967a_fay.yaml,
    1970_mintz.yaml, 1990_smith.a.b_jell.yaml, 1994_guensburg_sprinkle.yaml (emended:true) and 2015_sprinkle_sumrall.yaml.
    Could not confirm "Bell 1982" (data/trees/1982_bell.b.m.yaml) uses either name — that file has no
    edrioblastoid content at all; dropped from this answer''s Steganoblastidae list even though some informal
    accounts of this literature include it. Webby''s Art. 40 argument is quoted in full in notes/reviews/review_1968_webby.md
    sec.3 (p.514: "since Steganoblastidae, which is based on a junior objective synonym, has priority
    and has been a more widely used name, it would seem desirable that it be retained. This view accords
    with Art. 40..."); the same review documents Whiteaves introducing Steganoblastus in 1898 at Bather''s
    suggestion, quoting Webby''s own "Nomenclature and previous work" paragraph (p. 514) in full. This
    reasoning is not yet captured as tree-level content (no `notes` field holds it on any node) and is
    being added to the data in this same working branch — the answer above draws on the review''s quotation
    of the printed text, not on a tree node.'
- id: q045
  class: trajectory
  question: Who proposed placing rhenopyrgids inside Cyathocystidae, who followed, and who rejected it?
  scope:
    taxon: cyathocystidae
  expected:
    blocks:
    - tool: placed_under
      parameters: {record: rhenopyrgidae, parent: cyathocystidae}
    - tool: placements
      parameters: {records: [rhenopyrgidae]}
    shows:
    - "first Guensburg & Sprinkle 1994"
    - "not Cyathocystidae"
    answer: |
      Guensburg & Sprinkle (1994) propose it, translating Holloway & Jell's
      family Rhenopyrgidae down to subfamily Rhenopyrginae inside their own
      emended family Cyathocystidae (p. 21). Grigo (2000) follows, keeping
      the same subfamily-within-family nesting for his new Rhenopyrgus
      species.

      Sumrall, Heredia Rodríguez & Mestre (2013) reject it, citing their own
      phylogenetic results: "The phylogenetic analysis presented here, as
      well as that presented by Guensburg and Sprinkle (1994), did not
      uniquely recover rhenopyrgids and cyathocystids as sister taxa. For
      this reason, we do not include them within Cyathocystidae Bather,
      1899, but leave them assigned at family level within Edrioblastoidina
      Fay, 1962" (p. 773). Ewin et al. (2020) and Briggs et al. (2017) both
      keep family Rhenopyrgidae directly under suborder Edrioblastoidina
      rather than under Cyathocystidae, continuing the 2013 position without
      repeating its argument.
  evidence:
  - source: 1994_guensburg_sprinkle
    pages: 21
  - source: 2013_sumrall_heredia_rodríguez.c.m_mestre
    pages: 773
  verified: data/trees/1994_guensburg_sprinkle.yaml, .../cyathocystidae(emended)/children/1(rhenopyrginae,
    nomen transl., emended)/children/0(rhenopyrgus); data/trees/2000_grigo.yaml .../cyathocystidae/children/0(rhenopyrginae)/children/0(rhenopyrgus);
    data/trees/2013_sumrall_heredia_rodríguez.c.m_mestre.yaml, data/trees/2017_briggs.d.e.g_siveter.de.j_siveter.da.j_sutton.m.d_rahman.yaml
    and data/trees/2020_ewin_martin.m_isotalo_zamora.yaml each place rhenopyrgidae under edrioblastoidina
    directly, with no cyathocystidae ancestor. The p.773 rejection sentence, including the phylogenetic
    justification quoted above, is transcribed in notes/reviews/review_2013_sumrall_heredia_rodríguez.c.m_mestre.md
    line 15 and in data/sources.yaml's notes for that source; it is not itself captured as a claim on
    any tree node (no claim kind records "source A rejects source B's placement, citing reason X") — the
    second paragraph of the answer above is drawn from the reviewed printed text, not from a placement
    or act claim.
- id: q048
  class: trajectory
  question: What did Holloway & Jell (1983) say Dehm (1961) did with Pyrgocystis octogona, and what does
    Dehm's own paper do?
  scope:
    taxon: octogona_richter.r_1930
  expected:
    blocks:
      anyOf:
      - - tool: history
          parameters: {record: octogona_richter.r_1930}
        - tool: gap
          parameters: {source: 1983_holloway_jell, kind: synonymy}
      - - tool: statements
          parameters: {record: octogona_richter.r_1930}
        - tool: gap
          parameters: {source: 1983_holloway_jell, kind: synonymy}
    shows:
    - "Pyrgocystis octogona"
    - "The synonymy printed in Holloway & Jell 1983 has not yet been entered"
    answer: |
      Two accounts that do not agree. Dehm's own paper keeps Pyrgocystis octogona in Pyrgocystis and does not move it into his new subgenus Rhenopyrgus; its entry ends in a comparison: "es [ist] erforderlich, diese Formen gesondert zu halten" ("it is necessary to keep these forms separate", p. 16). Holloway & Jell (1983) write of the same species that it "was assigned to Rhenopyrgus by Dehm (1961)" (p. 1004). Dehm's placement is held from his paper; Holloway & Jell's statement about Dehm is known only from their text and is not held as a placement of their own, and it does not match what Dehm printed.
  evidence:
  - source: 1961_dehm
    pages: 16
  - source: 1983_holloway_jell
    pages: 1004
  verified: data/trees/1961_dehm.yaml places octogona_richter.r_1930 under `pyrgocystis` with no `moved`
    field and no rhenopyrgus-subgenus placement; notes/reviews/review_1983_holloway_jell.md sec. 3 quotes
    the p.1004 sentence and Dehm's contrary p.16 conclusion in full. Per docs/claims.md ("What the vocabulary
    does not do"), no claim kind exists for one source's description of another source's act, so Holloway
    & Jell's sentence about Dehm is deliberately not modelled as a claim above — only Dehm's own placement
    is.
- id: q049
  class: trajectory
  question: Which cladistic analyses in the corpus include Rhenopyrgus, and where does each place it?
  scope:
    taxon: rhenopyrgus
  expected:
    blocks:
    - tool: placements
      parameters: {records: [rhenopyrgus], trees: [cladogram]}
    shows:
    - "Smith & Jell 1990"
    - "Guensburg & Sprinkle 1994"
    - "Sumrall et al. 2013"
    answer: |
      Three papers in the corpus carry Rhenopyrgus in a cladogram, from
      three sets of co-authors: Smith & Jell (1990), Guensburg & Sprinkle
      (1994) and Sumrall, Heredia Rodríguez & Mestre (2013). Each places
      it among the edrioasteroids in its own analysis; the classifications
      the same papers print are a separate question, answered by their
      taxonomic placements. No cladogram entered in the corpus places it
      with Pyrgocystis.
  evidence:
  - source: 1990_smith.a.b_jell
  - source: 1994_guensburg_sprinkle
  - source: 2013_sumrall_heredia_rodríguez.c.m_mestre
  verified: 'claims/: placement claims with subject rhenopyrgus and tree cladogram exist for
    exactly 1990_smith.a.b_jell (also a diagram), 1994_guensburg_sprinkle and
    2013_sumrall_heredia_rodríguez.c.m_mestre; a history with trees taxonomy and cladogram
    carries all three. Added 2026-09-12 so that reaching for cladograms is tested where the
    question asks for it, after q030 lost its cladogram selector (the default reads
    taxonomies only).'
