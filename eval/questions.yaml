# Evaluation questions v11 over the gold slice (Edrioblastoidea: Astrocystitidae;
# Rhenopyrgidae). Format and answer contract: eval/README.md; vocabulary:
# docs/claims.md. Mix: answerable 12, uncaptured 9, as-published 8, trajectory 15,
# absent 3. An expected answer is the blocks it is made of (a tool and the
# parameters that matter; alternatives under anyOf) and the strings the rendered
# answer shows. Answers speak to readers of the literature, never of the
# repository that holds them; `verified` may still cite files and paths.

- id: q001
  class: answerable
  question: What new class does Fay (1962) erect for the genus Astrocystites, and what family/order sit
    between the genus and the class?
  scope:
    taxon: astrocystites
    source: 1962_fay
  expected:
    blocks:
    - tool: contents
      parameters: {source: 1962_fay, record: edrioblastoidea}
    shows:
    - "Class Edrioblastoidea nov."
    - "Genus Astrocystites"
    answer: |
      Fay (1962) erects the new class Edrioblastoidea and places Astrocystites
      directly in it, removing the genus from the Edrioasteroidea. No order or
      family is interposed: "The genus Astrocystites Whiteaves is removed from
      the Edrioasteroidea and placed in a new class of echinoderms,
      Edrio-blastoidea..." (p. 201). Both "order" and "family" are absent from
      the paper entirely.
  evidence:
    source: 1962_fay
    pages: 201
  verified: 'data/trees/1962_fay.yaml, taxonomies/0 (edrioblastoidea, new:true) /children/0 (astrocystites,
    moved:{taxon: edrioasteroidea}); confirmed against notes/reviews/review_1962_fay.md sec. 2-3, which
    quotes the p.201 passage and notes both "order" and "family" never occur in the paper.'
- id: q002
  class: answerable
  question: Does Fay (1962) himself write that ottawaensis is the type species of Astrocystites, or is
    that flag the editor's own inference?
  scope:
    taxon: astrocystites
    source: 1962_fay
  expected:
    blocks:
    - tool: statements
      parameters: {record: ottawaensis_whiteaves_1897, source: 1962_fay}
    shows:
    - "type species"
    - "(editor)"
    answer: |
      It is editorial. Fay never writes "type species" anywhere in the paper
      (searched exhaustively); Astrocystites is simply treated as monotypic
      (one species discussed throughout). This designation of ottawaensis as
      the type species is recorded as the editor's own inference, not the
      paper's statement, on the basis that Fay never prints "type species" and
      the genus is monotypic (p. 201). A formal type-species designation, if
      one exists, would be in Whiteaves's 1897 original description, which is
      not part of this corpus at all.
  evidence:
    source: 1962_fay
    pages: 201
  verified: data/trees/1962_fay.yaml, taxonomies/0/children/0/children/0 (ottawaensis_whiteaves_1897,
    type:true, editorial.inferred:[type]); notes/reviews/review_1962_fay.md sec. 2-3 confirms "type species"
    never occurs in the paper's text.
- id: q003
  class: answerable
  question: What species do Smith & Jell (1990) designate as the type species of the new genus Cambroblastus?
  scope:
    taxon: cambroblastus
    source: 1990_smith.a.b_jell
  expected:
    blocks:
    - tool: contents
      parameters: {source: 1990_smith.a.b_jell, record: cambroblastus}
    shows:
    - "Type species. Cambroblastus enubilatus"
    answer: |
      Cambroblastus enubilatus, named new in the same paper (holotype QMF17872),
      is both the type species and the sole species Smith & Jell (1990) place
      in the new genus Cambroblastus, under family Astrocystitidae (order
      Edrioblastoida in this paper's own hierarchy).
  evidence:
    source: 1990_smith.a.b_jell
  verified: data/trees/1990_smith.a.b_jell.yaml, taxonomies/0/children/3(edrioblastoida)/children/0(astrocystitidae)/children/1(cambroblastus,
    new:true)/children/0(enubilatus_smith.a.b_jell_1990, type:true, new:true). No `pages` field exists
    on this node, and sources.yaml's 1990_smith.a.b_jell record carries no `pages` key at all, so no printed
    page is cited (this source has no review either; gold_inventory.md marks it "no audit").
- id: q004
  class: answerable
  question: What new genus and type species does Guensburg & Sprinkle (1994) erect within family Astrocystitidae?
  scope:
    taxon: lampteroblastus
    source: 1994_guensburg_sprinkle
  expected:
    blocks:
    - tool: contents
      parameters: {source: 1994_guensburg_sprinkle, record: astrocystitidae}
    shows:
    - "Genus Lampteroblastus gen. nov."
    - "Type species. Lampteroblastus hintzei"
    answer: |
      Guensburg & Sprinkle (1994) erect the new genus Lampteroblastus, with
      Lampteroblastus hintzei as its new, type species, inside an emended
      family Astrocystitidae, itself nested under suborder Edrioblastoidina
      (nomen translatum from class Edrioblastoidea) within order Edrioasterida.
  evidence:
    source: 1994_guensburg_sprinkle
    pages:
    - 1
    - 43
  verified: data/trees/1994_guensburg_sprinkle.yaml, taxonomies/0/children/0(edrioasteroidea)/children/4(edrioasterida,
    emended)/children/1(edrioblastoidina, nomen transl., emended)/children/0(astrocystitidae, emended)/children/2(lampteroblastus,
    new)/children/0(hintzei_guensburg_sprinkle_1994, type, new). Neither this node nor any ancestor in
    the file carries a `pages` field, so evidence cites the article's full range from sources.yaml (no
    finer page is captured anywhere in the corpus for this specific act).
