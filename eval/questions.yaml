# Evaluation questions v1 over the gold slice (Edrioblastoidea: Astrocystitidae;
# Rhenopyrgidae). Format and answer contract: eval/README.md; vocabulary:
# docs/claims.md. Mix: answerable 12, uncaptured 8, as-published 8, conflict 8,
# absent 4.

- id: q001
  class: answerable
  question: What new class does Fay (1962) erect for the genus Astrocystites, and what family/order sit
    between the genus and the class?
  scope:
    taxon: astrocystites
    source: 1962_fay
  expected:
    claims:
    - kind: act
      source: 1962_fay
      actKind: new
      subject: edrioblastoidea
    - kind: placement
      source: 1962_fay
      subject: astrocystites
      parent: edrioblastoidea
      position: 0
    - kind: act
      source: 1962_fay
      actKind: moved
      subject: astrocystites
      movedFrom: edrioasteroidea
    answer: |
      Fay (1962) erects the new class Edrioblastoidea and places Astrocystites
      directly in it, removing the genus from the Edrioasteroidea. No order or
      family is interposed: "The genus Astrocystites Whiteaves is removed from
      the Edrioasteroidea and placed in a new class of echinoderms,
      Edrio-blastoidea..." (p. 201). Both "order" and "family" are absent from
      the paper entirely.
  evidence:
    source: 1962_fay
    pages: 201
  verified: 'data/trees/1962_fay.yaml, taxonomies/0 (edrioblastoidea, new:true) /children/0 (astrocystites,
    moved:{taxon: edrioasteroidea}); confirmed against docs/reviews/review_1962_fay.md sec. 2-3, which
    quotes the p.201 passage and notes both "order" and "family" never occur in the paper.'
- id: q002
  class: answerable
  question: Does Fay (1962) himself write that ottawaensis is the type species of Astrocystites, or is
    that flag the editor's own inference?
  scope:
    taxon: astrocystites
    source: 1962_fay
  expected:
    claims:
    - kind: act
      source: 1962_fay
      actKind: type
      subject: ottawaensis_whiteaves_1897
      editorial:
        inferred:
        - type
        basis: Fay never prints "type species"; the genus is monotypic (p. 201)
    - kind: editorial
      source: 1962_fay
      subject: ottawaensis_whiteaves_1897
      inferred:
      - type
    answer: |
      It is editorial. Fay never writes "type species" anywhere in the paper
      (searched exhaustively); Astrocystites is simply treated as monotypic
      (one species discussed throughout). The tree's `type: true` flag on
      ottawaensis carries an `editorial.inferred: [type]` block recording
      this, with basis "Fay never prints 'type species'; the genus is
      monotypic (p. 201)." A formal type-species designation, if one exists,
      would be in Whiteaves's 1897 original description, which has no source
      record in this dataset.
  evidence:
    source: 1962_fay
    pages: 201
  verified: data/trees/1962_fay.yaml, taxonomies/0/children/0/children/0 (ottawaensis_whiteaves_1897,
    type:true, editorial.inferred:[type]); docs/reviews/review_1962_fay.md sec. 2-3 confirms "type species"
    never occurs in the paper's text.
